name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 300
    
    steps:
      - name: Free disk space
        shell: pwsh
        run: |
          echo "Disk space before cleanup:"
          Get-PSDrive C | Select-Object Used,Free
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft Visual Studio\2019" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\CodeQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
          echo "Disk space after cleanup:"
          Get-PSDrive C | Select-Object Used,Free
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic
      
      - name: Configure conda for stability
        shell: bash -l {0}
        run: |
          conda config --set remote_connect_timeout_secs 60
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --show
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Python version:"
          python --version
          
          echo "Installing PyTorch with CUDA 12.8 (Blackwell sm_120 support)..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          
          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt
          
          echo "Installing conda-pack..."
          pip install --retries 5 --timeout 60 conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: expected cu128, got {v} (CUDA {c})'"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
      
      - name: Compile Python backend with Nuitka
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Installing Nuitka..."
          pip install --retries 5 --timeout 60 nuitka ordered-set
          
          echo "=== Compiling core backend files to .pyd ==="
          
          # Core business logic files
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/detection.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/websocket.py"
            "backend/api/models.py"
            "backend/services/detector.py"
          )
          
          for pyfile in "${CORE_FILES[@]}"; do
            if [ -f "$pyfile" ]; then
              dir=$(dirname "$pyfile")
              filename=$(basename "$pyfile" .py)
              echo "Compiling $pyfile ..."
              python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
              
              # If .pyd was generated, remove the .py source
              if ls "$dir"/${filename}*.pyd 1>/dev/null 2>&1; then
                echo "  -> Compiled successfully, removing source: $pyfile"
                rm -f "$pyfile"
              else
                echo "  -> Compilation failed, keeping source: $pyfile"
              fi
            fi
          done
          
          echo "=== Compilation complete ==="
          echo "Remaining .py files in backend/api/:"
          ls -la backend/api/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/api/:"
          ls -la backend/api/*.pyd 2>/dev/null || echo "  (none)"
          echo "Remaining .py files in backend/services/:"
          ls -la backend/services/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/services/:"
          ls -la backend/services/*.pyd 2>/dev/null || echo "  (none)"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Packing conda environment..."
          conda clean -a -y 2>/dev/null || true
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
          
          echo "Verifying packed environment PyTorch cu128..."
          python/python.exe -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'Packed PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: packed env expected cu128, got {v}'"
      
      - name: Download FFmpeg
        shell: pwsh
        run: |
          echo "Downloading FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Path "ffmpeg" -Force
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg/"
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "ffmpeg/"
          Remove-Item -Path "ffmpeg-temp" -Recurse -Force
          Remove-Item -Path "ffmpeg.zip" -Force
          echo "FFmpeg downloaded:"
          Get-ChildItem ffmpeg
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Verify resources before build
        shell: pwsh
        run: |
          echo "=== Checking required resources ==="
          echo "Frontend dist:"
          Test-Path "frontend/dist" 
          Get-ChildItem "frontend/dist" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Backend:"
          Test-Path "backend"
          echo "Python env:"
          Test-Path "python-env/python"
          echo "FFmpeg:"
          Test-Path "ffmpeg"
          Get-ChildItem "ffmpeg" -ErrorAction SilentlyContinue | Select-Object Name
      
      - name: Build Electron App (dir)
        shell: pwsh
        run: |
          cd electron
          npm ci
          echo "Building unpacked app directory..."
          npx electron-builder --dir --x64 2>&1
          echo "=== Unpacked directory ==="
          Test-Path "dist\win-unpacked" 
          Get-ChildItem "dist\win-unpacked" -ErrorAction SilentlyContinue | Select-Object Name
          $size = (Get-ChildItem "dist\win-unpacked" -Recurse | Measure-Object -Property Length -Sum).Sum
          echo "Total unpacked size: $([math]::Round($size/1GB, 2)) GB"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          echo "Installing Inno Setup 6..."
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { echo "ERROR: ISCC.exe not found"; exit 1 }
          echo "Inno Setup installed: $iscc"
          
          echo "Available languages:"
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" -Filter "*.isl" | Select-Object Name

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version -or $version -eq "${{ github.ref_name }}") { $version = "2.0.8" }
          echo "Building installer for version $version..."
          
          $issFile = "electron\build\installer.iss"
          $content = Get-Content $issFile -Raw
          $content = $content -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText($issFile, $content, [System.Text.Encoding]::UTF8)
          echo "Converted ISS to CRLF + UTF-8"
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="$version" "electron\build\installer.iss"
          
          echo "=== Installer output ==="
          Get-ChildItem "electron\dist" -Filter "*.exe" | Select-Object Name, Length
          $setup = Get-ChildItem "electron\dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { echo "ERROR: Setup exe not found!"; exit 1 }
          echo "Installer: $($setup.Name) ($([math]::Round($setup.Length/1GB, 2)) GB)"
      
      - name: Upload Release to tianjun-releases
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Creating release ${VERSION} on tianjun-releases..."

          SETUP_FILE=$(find electron/dist -name "TianJun-AI-Vision-*-Setup.exe" -type f | head -1)

          if [ -z "$SETUP_FILE" ]; then
            echo "ERROR: Setup exe not found!"
            ls -la electron/dist/
            exit 1
          fi

          echo "Found installer: $SETUP_FILE"
          echo "SETUP_FILE=$SETUP_FILE" >> $GITHUB_ENV

          cat > /tmp/release-notes.md << 'EOF'
          ## 更新内容

          ### 新功能
          - **海康SDK直连 (HCNetSDK)**：支持通过海康私有协议直连NVR/IP摄像头，比RTSP更稳定
          - **容器跟踪模式**：跟踪模式新增"容器模式"策略，支持箱子+物品层级跟踪，每箱独立结算

          ### 改进
          - **PyTorch CUDA 12.8**：支持 RTX 50 系列 (Blackwell) 显卡 GPU 加速
          - **HCNetSDK DLL 内置**：安装包自带海康SDK，无需手动复制

          ### 安装说明
          1. 下载 .exe 安装程序
          2. 双击运行安装
          3. 按提示完成安装
          4. 首次运行需安装 VC++ 运行时库（如未安装）
          5. **从旧版本升级会自动备份数据库和历史数据**
          EOF

          gh release delete "${VERSION}" --repo 17373531860/tianjun-releases --yes 2>/dev/null || true

          gh release create "${VERSION}" \
            --repo 17373531860/tianjun-releases \
            --title "${VERSION} - 天军科技AI视觉检测系统" \
            --notes-file /tmp/release-notes.md \
            "$SETUP_FILE"

          echo "Release created successfully!"

      - name: Split installer for Gitee
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem "electron/dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setupFile) {
            Write-Error "Setup exe not found!"
            exit 1
          }

          Write-Host "Splitting $($setupFile.Name) ($([math]::Round($setupFile.Length / 1MB, 1)) MB)..."

          $partsDir = "gitee-parts"
          New-Item -ItemType Directory -Path $partsDir -Force | Out-Null

          $chunkSize = 105 * 1024 * 1024  # ~100MB per chunk → ~20 parts for a 2GB installer
          $stream = [System.IO.File]::OpenRead($setupFile.FullName)
          $buffer = New-Object byte[] $chunkSize
          $partNum = 0

          while ($stream.Position -lt $stream.Length) {
              $bytesRead = $stream.Read($buffer, 0, $chunkSize)
              $partName = "{0}.part{1:D2}.part" -f $setupFile.Name, $partNum
              $partPath = Join-Path $partsDir $partName

              $fs = [System.IO.File]::OpenWrite($partPath)
              $fs.Write($buffer, 0, $bytesRead)
              $fs.Close()

              Write-Host "  Created: $partName ($([math]::Round($bytesRead / 1MB, 1)) MB)"
              $partNum++
          }
          $stream.Close()

          Write-Host "Total parts: $partNum"
          echo "TOTAL_PARTS=$partNum" >> $env:GITHUB_ENV

          # Compute SHA256 of original installer and each part
          $sha256 = (Get-FileHash $setupFile.FullName -Algorithm SHA256).Hash
          Write-Host "Installer SHA256: $sha256"
          $expectedSize = $setupFile.Length

          $partHashes = @{}
          $checksumLines = @()
          Get-ChildItem "$partsDir/*.part" | Sort-Object Name | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $partHashes[$_.Name] = $h
              $checksumLines += "$h  $($_.Name)"
              Write-Host "  $($_.Name) SHA256: $h"
          }
          $checksumLines | Out-File -FilePath "$partsDir/checksums.txt" -Encoding UTF8
          Write-Host "Checksums file created"

          # Generate merge script (PowerShell-based for reliable hash verification)
          $version = "${{ github.ref_name }}"
          $exeName = $setupFile.Name
          $batContent = @"
          @echo off
          chcp 65001 >nul
          echo ============================================
          echo   天军科技AI视觉检测系统 - 安装包合并工具
          echo   版本: $version
          echo ============================================
          echo.
          powershell -ExecutionPolicy Bypass -Command "& {
            `$ErrorActionPreference='Stop'
            `$output='$exeName'
            `$expectedParts=$partNum
            `$expectedHash='$sha256'
            `$expectedSize=$expectedSize

            `$parts = Get-ChildItem -Filter '*.part' | Sort-Object Name
            if (`$parts.Count -eq 0) {
              Write-Host '[错误] 没有找到 .part 文件！' -ForegroundColor Red
              Write-Host '请确保从两个仓库下载所有 .part 文件放在同一文件夹。'
              Write-Host '  第一部分: https://gitee.com/xu-yanzhi32/tianjun-releases/releases'
              Write-Host '  第二部分: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases'
              exit 1
            }
            if (`$parts.Count -ne `$expectedParts) {
              Write-Host `"[错误] 分块数量不对！找到 `$(`$parts.Count)，期望 `$expectedParts`" -ForegroundColor Red
              exit 1
            }
            Write-Host `"找到 `$(`$parts.Count) 个分块文件，正在逐个校验...`" -ForegroundColor Cyan
            Write-Host ''

            `$bad = 0
            `$checksums = @{}
            if (Test-Path 'checksums.txt') {
              Get-Content 'checksums.txt' | ForEach-Object {
                `$line = `$_.Trim()
                if (`$line -and `$line.Length -gt 64) {
                  `$h = `$line.Substring(0,64)
                  `$f = `$line.Substring(66).Trim()
                  `$checksums[`$f] = `$h
                }
              }
            }

            foreach (`$p in `$parts) {
              `$hash = (Get-FileHash `$p.FullName -Algorithm SHA256).Hash
              if (`$checksums.ContainsKey(`$p.Name)) {
                if (`$hash -eq `$checksums[`$p.Name]) {
                  Write-Host `"  [OK] `$(`$p.Name)`" -ForegroundColor Green
                } else {
                  Write-Host `"  [损坏] `$(`$p.Name)`" -ForegroundColor Red
                  Write-Host `"         期望: `$(`$checksums[`$p.Name])`"
                  Write-Host `"         实际: `$hash`"
                  `$bad++
                }
              } else {
                Write-Host `"  [?] `$(`$p.Name) (无校验记录)`" -ForegroundColor Yellow
              }
            }
            Write-Host ''

            if (`$bad -gt 0) {
              Write-Host `"[错误] 发现 `$bad 个损坏文件！请重新下载标记为 [损坏] 的文件。`" -ForegroundColor Red
              exit 1
            }

            Write-Host '所有分块验证通过，正在合并...' -ForegroundColor Cyan
            if (Test-Path `$output) { Remove-Item `$output -Force }
            `$outStream = [System.IO.File]::Create(`$output)
            `$i = 0
            foreach (`$p in `$parts) {
              `$i++
              `$bytes = [System.IO.File]::ReadAllBytes(`$p.FullName)
              `$outStream.Write(`$bytes, 0, `$bytes.Length)
              Write-Host `"  [`$i/`$(`$parts.Count)] `$(`$p.Name) OK`"
            }
            `$outStream.Close()

            `$actualSize = (Get-Item `$output).Length
            if (`$actualSize -ne `$expectedSize) {
              Write-Host `"[错误] 文件大小不匹配！实际: `$actualSize, 期望: `$expectedSize`" -ForegroundColor Red
              Remove-Item `$output -Force
              exit 1
            }

            Write-Host '' 
            Write-Host '正在做最终 SHA256 校验...' -ForegroundColor Cyan
            `$finalHash = (Get-FileHash `$output -Algorithm SHA256).Hash
            if (`$finalHash -eq `$expectedHash) {
              Write-Host ''
              Write-Host '============================================' -ForegroundColor Green
              Write-Host `"  [成功] 合并并验证通过！`" -ForegroundColor Green
              Write-Host `"  安装程序: `$output`" -ForegroundColor Green
              Write-Host `"  SHA256: `$finalHash`" -ForegroundColor Green
              Write-Host '============================================' -ForegroundColor Green
              Write-Host ''
              Write-Host '请双击运行安装程序进行安装。'
            } else {
              Write-Host `"[错误] SHA256 校验失败！`" -ForegroundColor Red
              Write-Host `"  实际: `$finalHash`"
              Write-Host `"  期望: `$expectedHash`"
              Remove-Item `$output -Force
            }
          }"
          echo.
          pause
          "@

          $batContent | Out-File -FilePath "$partsDir/merge_installer.bat" -Encoding UTF8
          Write-Host "Merge script created: merge_installer.bat"

          # List all files
          Write-Host "`nFiles in $partsDir :"
          Get-ChildItem $partsDir | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Clean ALL old Gitee releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for REPO in tianjun-releases tianjun-releases-2; do
            echo "=== Cleaning all releases from $REPO ==="
            RELEASES=$(curl -s "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null)
            IDS=$(echo "$RELEASES" | python3 -c "
          import sys, json
          for r in json.load(sys.stdin):
              print(r['id'])
          " 2>/dev/null || echo "")
            for RID in $IDS; do
              echo "  Deleting release $RID from $REPO..."
              curl -s -X DELETE "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RID}?access_token=${GITEE_TOKEN}"
              sleep 1
            done
          done
          echo "Waiting 10s for quota to settle..."
          sleep 10

      - name: Upload to Gitee (repo 1 - first batch)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TOTAL_PARTS="${TOTAL_PARTS}"
          HALF=$(( (TOTAL_PARTS + 1) / 2 ))

          echo "Total parts: $TOTAL_PARTS, Repo 1 gets: parts 00 to $(printf '%02d' $((HALF - 1)))"

          upload_file() {
            local REPO="$1" RELEASE_ID="$2" FILE_PATH="$3"
            local FNAME=$(basename "$FILE_PATH")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 1200 \
                -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE_PATH}")
              if [ "$HTTP_CODE" = "201" ]; then
                RESP_NAME=$(python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('name',''))" 2>/dev/null || echo "$FNAME")
                echo "  OK: $RESP_NAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('message','unknown error'))" 2>/dev/null || true
              sleep 5
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${VERSION} on tianjun-releases..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${VERSION}',
            'name': '${VERSION} TianJun AI Vision (Part 1)',
            'body': '## ${VERSION} TianJun AI Vision (Part 1)\n\nDownload Part 2: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases/tag/${VERSION}-part2\n\n### How to use\n1. Download all .part files and merge_installer.bat from this page\n2. Download all .part files from Part 2\n3. Put all files in the same folder\n4. Run merge_installer.bat\n5. Run the merged installer',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_release_body.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/tianjun-releases/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_release_body.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created with ID: $RELEASE_ID"

          # Upload merge script and checksums
          echo "Uploading merge script..."
          upload_file "tianjun-releases" "$RELEASE_ID" "gitee-parts/merge_installer.bat" || echo "Warning: merge script upload failed, continuing..."
          echo "Uploading checksums..."
          upload_file "tianjun-releases" "$RELEASE_ID" "gitee-parts/checksums.txt" || echo "Warning: checksums upload failed, continuing..."

          # Upload first batch of parts
          FAIL_COUNT=0
          for i in $(seq 0 $((HALF - 1))); do
            PART_NAME=$(printf "*.part%02d.part" $i)
            PART_FILE=$(ls gitee-parts/$PART_NAME 2>/dev/null | head -1)
            if [ -n "$PART_FILE" ]; then
              echo "Uploading $(basename $PART_FILE)..."
              upload_file "tianjun-releases" "$RELEASE_ID" "$PART_FILE" || FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "Repo 1 upload complete! (failures: $FAIL_COUNT)"

      - name: Upload to Gitee (repo 2 - second batch)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TOTAL_PARTS="${TOTAL_PARTS}"
          HALF=$(( (TOTAL_PARTS + 1) / 2 ))

          if [ "$HALF" -ge "$TOTAL_PARTS" ]; then
            echo "All parts fit in repo 1, skipping repo 2."
            exit 0
          fi

          echo "Repo 2 gets: parts $(printf '%02d' $HALF) to $(printf '%02d' $((TOTAL_PARTS - 1)))"

          upload_file() {
            local REPO="$1" RELEASE_ID="$2" FILE_PATH="$3"
            local FNAME=$(basename "$FILE_PATH")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 1200 \
                -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE_PATH}")
              if [ "$HTTP_CODE" = "201" ]; then
                RESP_NAME=$(python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('name',''))" 2>/dev/null || echo "$FNAME")
                echo "  OK: $RESP_NAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('message','unknown error'))" 2>/dev/null || true
              sleep 5
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          TAG2="${VERSION}-part2"
          echo "Creating release ${TAG2} on tianjun-releases-2..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${TAG2}',
            'name': '${VERSION} TianJun AI Vision (Part 2)',
            'body': '## ${VERSION} TianJun AI Vision (Part 2)\n\nDownload Part 1: https://gitee.com/xu-yanzhi32/tianjun-releases/releases/tag/${VERSION}\n\nPut all .part files together with Part 1 files, then run merge_installer.bat from Part 1.',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_release_body2.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/tianjun-releases-2/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_release_body2.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release on repo 2!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created with ID: $RELEASE_ID"

          # Upload second batch of parts
          FAIL_COUNT=0
          for i in $(seq $HALF $((TOTAL_PARTS - 1))); do
            PART_NAME=$(printf "*.part%02d.part" $i)
            PART_FILE=$(ls gitee-parts/$PART_NAME 2>/dev/null | head -1)
            if [ -n "$PART_FILE" ]; then
              echo "Uploading $(basename $PART_FILE)..."
              upload_file "tianjun-releases-2" "$RELEASE_ID" "$PART_FILE" || FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "Repo 2 upload complete! (failures: $FAIL_COUNT)"
          echo ""
          echo "=== Gitee Release URLs ==="
          echo "Part 1: https://gitee.com/xu-yanzhi32/tianjun-releases/releases/tag/${VERSION}"
          echo "Part 2: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases/tag/${VERSION}-part2"
