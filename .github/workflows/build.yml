name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic
      
      - name: Configure conda for stability
        shell: bash -l {0}
        run: |
          conda config --set remote_connect_timeout_secs 60
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --show
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Python version:"
          python --version
          
          echo "Installing PyTorch with CUDA 12.1..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
          
          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt
          
          echo "Installing conda-pack..."
          pip install --retries 5 --timeout 60 conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; print(f'PyTorch: {torch.__version__}, CUDA: {torch.version.cuda}')"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Packing conda environment..."
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
      
      - name: Download FFmpeg
        shell: pwsh
        run: |
          echo "Downloading FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Path "ffmpeg" -Force
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg/"
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "ffmpeg/"
          Remove-Item -Path "ffmpeg-temp" -Recurse -Force
          Remove-Item -Path "ffmpeg.zip" -Force
          echo "FFmpeg downloaded:"
          Get-ChildItem ffmpeg
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Verify resources before build
        shell: pwsh
        run: |
          echo "=== Checking required resources ==="
          echo "Frontend dist:"
          Test-Path "frontend/dist" 
          Get-ChildItem "frontend/dist" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Backend:"
          Test-Path "backend"
          echo "Python env:"
          Test-Path "python-env/python"
          echo "FFmpeg:"
          Test-Path "ffmpeg"
          Get-ChildItem "ffmpeg" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Model:"
          Test-Path "best.pt"
      
      - name: Build Electron App
        shell: pwsh
        run: |
          cd electron
          npm ci
          echo "Starting electron-builder..."
          npx electron-builder --win --x64 2>&1
          echo "=== Build completed, listing all files ==="
          echo "--- electron/ root ---"
          Get-ChildItem -ErrorAction SilentlyContinue | Select-Object Name
          echo "--- electron/dist/ ---"
          Get-ChildItem "dist" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          echo "--- Looking for .exe anywhere ---"
          Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - 天钧AI视觉检测系统
          files: |
            electron/dist/TianJun-AI-Vision-*-Setup.exe
          body: |
            ## v1.3.7 更新内容
            
            ### 修复
            - 修复 shutdown.html 未打包导致关闭窗口无法显示
            - 修复 app 文件夹缺少 package.json 导致补丁无法使用
            - 改进启动时清理残留进程逻辑，增加端口检测和等待机制
            - 静态步骤自定义条件触发修复
            - 置信度阈值、最少帧数全局生效
            - 持续时间过滤
            
            ### 新增
            - 检测运行时锁定控件
            - 启动时自动清理残留进程
            - "良率"改名为"合格率"
            
            ### 安装说明
            1. 下载 .exe 安装程序
            2. 双击运行安装
            3. 按提示完成安装
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
