# 2026-09 多平台打包: Windows exe + Ubuntu deb + macOS dmg (arm64/x64)
name: Build Installers (Windows / Linux / macOS)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  # ==================== tag 构建前的测试 gate ====================
  # 只在 tag 触发时跑（main push 已有 test-virtual.yml 并行回归）。
  # 复用 test-virtual 的 pytest+BDD 虚拟测试集：红了就不进入 4 小时打包，
  # 避免把带回归的版本发给客户。
  test-gate:
    name: Test gate (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNTIME_MODE: test
      TIANJUN_TEST_MODE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install system deps for opencv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-bdd httpx

      - name: Run pytest end-to-end (TestClient, no real ports)
        run: |
          python -m pytest \
            tests/test_synthetic_full_flow.py \
            tests/step_defs/ \
            -v --tb=short --maxfail=10

  build-windows:
    # tag 构建必须先过 test-gate；main push / 手动触发时 gate 被 skip，直接放行
    needs: test-gate
    if: always() && (needs.test-gate.result == 'success' || needs.test-gate.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 300
    
    steps:
      - name: Free disk space
        shell: pwsh
        run: |
          function Show-Disk {
            $d = Get-PSDrive C
            $total = $d.Used + $d.Free
            $pct = if ($total -gt 0) { [math]::Round($d.Used / $total * 100, 1) } else { 0 }
            Write-Host ("Disk C: used={0:N2}GB free={1:N2}GB ({2}% used)" -f ($d.Used/1GB), ($d.Free/1GB), $pct)
            return $pct
          }

          Write-Host "Disk space before cleanup:"
          $pctBefore = Show-Disk

          # 基础清理（每次构建都跑）
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft Visual Studio\2019" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\CodeQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue

          # v3.8.1: 磁盘占用 >70% 时加做深度清理（conda-pack + Inno 大文件容易顶满 runner）
          $pctMid = Show-Disk
          if ($pctMid -gt 70) {
            Write-Host "WARNING: disk usage ${pctMid}% > 70%, running deep cleanup..."
            Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\MySQL" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\Git\usr\share\locale" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Docker" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:ProgramData\Docker" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem "$env:TEMP" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            if (Get-Command conda -ErrorAction SilentlyContinue) {
              try { conda clean --all -y } catch { Write-Host "conda clean skipped: $_" }
            }
          }

          Write-Host "Disk space after cleanup:"
          $pctAfter = Show-Disk
          if ($pctAfter -gt 85) {
            Write-Host "::warning::Disk still ${pctAfter}% used after cleanup — build may fail on conda-pack/Inno"
          }
      
      - name: Checkout code
        uses: actions/checkout@v4

      # 2026-09 内置能力模型入仓: headpose.onnx (90MB) 不进 git, 从模型资产
      # release 下载进包并按 sha256 校验 (v3.51.4 交付审计: 缺文件必须红灯,
      # 不允许静默出残缺安装包)。yolo11n.pt / yolo11n-pose.pt 已随 git 带出。
      - name: Fetch builtin model assets (headpose.onnx)
        shell: pwsh
        run: |
          $dst = "backend/data/models/headpose.onnx"
          gh release download model-assets-headpose-v1 --pattern headpose.onnx --output $dst --clobber
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          $want = "422b69d17bf02e164bd1062f5e970f67f1688cadf7d700800fad5fa12a16fc82"
          if ($hash -ne $want) { Write-Host "::error::headpose.onnx sha256 不匹配: $hash"; exit 1 }
          Write-Host "OK headpose.onnx ($hash)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic
      
      - name: Configure conda for stability
        shell: bash -l {0}
        run: |
          conda config --set remote_connect_timeout_secs 60
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --show
          # 2026-06-11 (v3.19.0): defaults 渠道元数据漂移把 openssl 解到 3.0.18,
          # 与 python-3.10.20 该 build 的 _ssl 不匹配 (ImportError: SSL module is
          # not available → pip 全挂). 钉回 3.5.x (v3.18.0 成功组合是 3.5.6).
          conda install -n tianjun -y "openssl>=3.5"
          conda run -n tianjun python -c "import ssl; print('SSL OK:', ssl.OPENSSL_VERSION)"
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Python version:"
          python --version
          
          echo "Installing PyTorch with CUDA 12.8 (Blackwell sm_120 support)..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          
          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt
          
          echo "Installing ONNX Runtime GPU..."
          pip install --retries 5 --timeout 60 onnxruntime-gpu
          
          echo "Installing TensorRT (锁 <11: TRT 11.x 删除 EXPLICIT_BATCH 标志, 与 ultralytics<=8.4.16 导出代码不兼容; 10.x 已实测可转)..."
          pip install --retries 5 --timeout 120 "tensorrt>=10.0,<11" --extra-index-url https://pypi.nvidia.com
          
          echo "Installing scipy (ultralytics dependency)..."
          pip install --retries 5 --timeout 60 "scipy>=1.10.0"
          
          echo "Installing mediapipe (with --no-deps to avoid opencv conflicts)..."
          pip install --retries 5 --timeout 60 --no-deps "mediapipe>=0.10.0,<0.10.21"
          pip install --retries 5 --timeout 60 absl-py attrs flatbuffers jax jaxlib matplotlib "protobuf>=4.25.3,<5" sounddevice sentencepiece
          
          echo "Removing conflicting opencv packages..."
          pip uninstall opencv-python opencv-python-headless opencv-contrib-python -y 2>/dev/null || true
          
          echo "Force-reinstalling numpy from pip (conda numpy ABI incompatible with pip opencv)..."
          pip install --retries 5 --timeout 60 --force-reinstall "numpy>=1.24.0,<2.0"
          
          echo "Installing opencv-contrib-python..."
          pip install --retries 5 --timeout 60 --no-deps "opencv-contrib-python>=4.8.0,<4.11"
          
          echo "Installing conda-pack..."
          pip install --retries 5 --timeout 60 conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: expected cu128, got {v} (CUDA {c})'"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
          python -c "import cv2; print(f'OpenCV: {cv2.__version__}')"
          python -c "import numpy as np; v=np.__version__; print(f'NumPy: {v}'); assert int(v.split('.')[0]) < 2, f'FATAL: numpy {v} >= 2.0 is incompatible with OpenCV 4.11'"
          python -c "import cv2, numpy as np; img=np.zeros((100,100,3),dtype=np.uint8); cv2.resize(img,(50,50)); print('OpenCV+NumPy ABI: OK')"
          python -c "import mediapipe; print(f'MediaPipe: {mediapipe.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}, providers: {onnxruntime.get_available_providers()}')"
          python -c "try:
            import tensorrt as t; v=t.__version__; print(f'TensorRT: {v}'); assert int(v.split('.')[0])==10, f'FATAL: TensorRT {v} 非 10.x — 11.x 删除 EXPLICIT_BATCH 与 ultralytics<=8.4.16 导出不兼容, 客户机转换必崩'
          except ImportError:
            print('WARNING: TensorRT not available (non-fatal on CI without GPU)')"
          python -c "import scipy; print(f'SciPy: {scipy.__version__}')"
          echo "Verifying plugin-system crypto deps (v3.15.x 现场缺 cryptography 导致验签假性失败)..."
          python -c "import cryptography; print(f'cryptography: {cryptography.__version__}')"
          python -c "import jsonschema; print(f'jsonschema: {jsonschema.__version__}')"
          echo "Checking opencv packages..."
          pip list | grep -i opencv
          echo "Checking inference engine packages..."
          pip list | grep -iE "onnx|tensorrt|scipy"
      
      - name: Compile Python backend with Nuitka
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Installing Nuitka..."
          pip install --retries 5 --timeout 60 nuitka ordered-set
          
          echo "=== Compiling core backend files to .pyd ==="
          
          # Core business logic files（2026-07 白名单重审：
          #   剔除 3 个已不存在的历史项 detection.py / websocket.py / services/detector.py；
          #   纳入 source_routes + Top5 大 mixin + scanner/mes_hooks/weighing_engine，
          #   否则这些核心 IP 以明文源码出厂）
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/source_routes.py"
            "backend/api/source_per_item_mixin.py"
            "backend/api/source_session_lifecycle_mixin.py"
            "backend/api/source_settlement_mixin.py"
            "backend/api/source_tracking_mixin.py"
            "backend/api/source_periodic_actions_mixin.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/models.py"
            "backend/services/scanner.py"
            "backend/services/mes_hooks.py"
            "backend/services/weighing_engine.py"
          )
          
          # 白名单文件缺失 = 有人改名/删文件没同步白名单 → 直接 fail，
          # 不再静默跳过（历史上 3 个失效项静默跳了几十个版本才被发现）
          for pyfile in "${CORE_FILES[@]}"; do
            if [ ! -f "$pyfile" ]; then
              echo "::error::CORE_FILES 白名单文件不存在: $pyfile （改名/删除后请同步 build.yml）"
              exit 1
            fi
          done
          
          for pyfile in "${CORE_FILES[@]}"; do
            dir=$(dirname "$pyfile")
            filename=$(basename "$pyfile" .py)
            echo "Compiling $pyfile ..."
            python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
            
            # If .pyd was generated, remove the .py source
            if ls "$dir"/${filename}*.pyd 1>/dev/null 2>&1; then
              echo "  -> Compiled successfully, removing source: $pyfile"
              rm -f "$pyfile"
            else
              echo "  -> Compilation failed, keeping source: $pyfile"
            fi
          done
          
          echo "=== Compilation complete ==="
          echo "Remaining .py files in backend/api/:"
          ls -la backend/api/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/api/:"
          ls -la backend/api/*.pyd 2>/dev/null || echo "  (none)"
          echo "Remaining .py files in backend/services/:"
          ls -la backend/services/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/services/:"
          ls -la backend/services/*.pyd 2>/dev/null || echo "  (none)"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Packing conda environment..."
          conda clean -a -y 2>/dev/null || true
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force --ignore-missing-files
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
          
          echo "Verifying packed environment PyTorch cu128..."
          python/python.exe -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'Packed PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: packed env expected cu128, got {v}'"
      
      - name: Download FFmpeg
        shell: pwsh
        run: |
          echo "Downloading FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Path "ffmpeg" -Force
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg/"
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "ffmpeg/"
          Remove-Item -Path "ffmpeg-temp" -Recurse -Force
          Remove-Item -Path "ffmpeg.zip" -Force
          echo "FFmpeg downloaded:"
          Get-ChildItem ffmpeg
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Verify resources before build
        shell: pwsh
        run: |
          echo "=== Checking required resources ==="
          echo "Frontend dist:"
          Test-Path "frontend/dist" 
          Get-ChildItem "frontend/dist" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Backend:"
          Test-Path "backend"
          echo "Python env:"
          Test-Path "python-env/python"
          echo "FFmpeg:"
          Test-Path "ffmpeg"
          Get-ChildItem "ffmpeg" -ErrorAction SilentlyContinue | Select-Object Name
      
      - name: Build Electron App (dir)
        shell: pwsh
        run: |
          cd electron
          npm ci
          echo "Building unpacked app directory..."
          npx electron-builder --dir --x64 2>&1
          echo "=== Unpacked directory ==="
          Test-Path "dist\win-unpacked" 
          Get-ChildItem "dist\win-unpacked" -ErrorAction SilentlyContinue | Select-Object Name
          $size = (Get-ChildItem "dist\win-unpacked" -Recurse | Measure-Object -Property Length -Sum).Sum
          echo "Total unpacked size: $([math]::Round($size/1GB, 2)) GB"

      # v3.15.1: 打包资源自检 — 防止"新增资源忘记加进 files/extraResources"复发.
      # 历史教训: v3.15.0 漏打包 plugin.schema.json(插件装不上) + splash.html(启动无动画).
      # 缺任一关键资源直接红灯阻断发版, 不让残缺安装包流到客户.
      - name: Verify packaged resources (防资源漏打包自检)
        shell: pwsh
        working-directory: electron
        run: |
          $base = "dist\win-unpacked\resources"
          $fail = $false

          # 1) extraResources 产物 (文件系统直接可查) — 插件校验运行时刚需
          $extraMust = @(
            "$base\docs\plugin-system\plugin.schema.json",
            "$base\docs\plugin-system\customer-codes.md",
            "$base\backend\main.py",
            # v3.51.4: PG 组件的配套迁移工具 (v3.49~v3.51.3 从没进过包,
            # 客户勾了 PG 也没法搬旧数据 — 解剖成品安装包才发现)
            "$base\scripts\db\sqlite_to_pg.py",
            # 2026-09 内置能力模型入仓: 出厂权重三件套 (缺任一 = 内置模型行
            # seed 跳过 = 客户拿到"没有内置模型"的安装包, 红灯阻断)
            "$base\backend\data\models\yolo11n.pt",
            "$base\backend\data\models\yolo11n-pose.pt",
            "$base\backend\data\models\headpose.onnx"
          )
          foreach ($f in $extraMust) {
            if (Test-Path $f) { Write-Host "OK  extraResource: $f" }
            else { Write-Host "::error::缺失打包资源(extraResources): $f"; $fail = $true }
          }

          # 2) app.asar 内 files 资源 (需 asar list) — 启动 splash 动画
          $asarPath = "$base\app.asar"
          if (-not (Test-Path $asarPath)) { Write-Host "::error::app.asar 不存在: $asarPath"; exit 1 }
          # asar list 在 Windows 输出反斜杠路径(\splash\index.html), 归一成正斜杠再匹配,
          # 否则带分隔符的目标(如 splash/index.html)会被误判缺失.
          $asarList = (npx --yes asar list "$asarPath") -replace '\\','/'
          $asarMust = @("splash.html", "splash/index.html", "main.js")
          foreach ($f in $asarMust) {
            if ($asarList | Select-String -SimpleMatch $f) { Write-Host "OK  asar: $f" }
            else { Write-Host "::error::app.asar 缺失关键资源: $f"; $fail = $true }
          }

          if ($fail) { Write-Host "打包资源自检未通过 — 阻断发版 (检查 electron/package.json 的 files/extraResources)"; exit 1 }
          Write-Host "打包资源自检通过"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          echo "Installing Inno Setup 6..."
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { echo "ERROR: ISCC.exe not found"; exit 1 }
          echo "Inno Setup installed: $iscc"
          
          echo "Available languages:"
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" -Filter "*.isl" | Select-Object Name

      - name: Stage PostgreSQL portable (WS5 嵌入式 PG 组件)
        shell: pwsh
        run: |
          # v3.51.3: 把 PG Windows 便携包铺到 electron\dist\pg-portable\,
          # 配合 ISCC /DIncludePostgres 让安装包真正带出 PG 可选组件.
          # 历史教训: v3.49 只写了 installer.iss 的 #ifdef, CI 从没传过开关,
          # 导致 v3.49~v3.51.2 发出去的安装包里根本没有 PG 选项.
          $url = "https://get.enterprisedb.com/postgresql/postgresql-16.15-1-windows-x64-binaries.zip"
          $zip = "$env:RUNNER_TEMP\pg-binaries.zip"
          $ok = $false
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 600
              $ok = $true; break
            } catch {
              echo "PG download attempt $i failed: $_"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { echo "::error::PostgreSQL 便携包下载失败 — 阻断发版 (不允许再次静默发出无 PG 的包)"; exit 1 }
          
          $extract = "$env:RUNNER_TEMP\pg-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $pgsql = Join-Path $extract "pgsql"
          if (-not (Test-Path "$pgsql\bin\initdb.exe")) { echo "::error::解压后缺 pgsql\bin\initdb.exe"; exit 1 }
          
          # 裁掉服务端用不到的大头 (pgAdmin/StackBuilder/符号/文档/头文件), 只留 bin/lib/share
          foreach ($d in @("pgAdmin 4", "StackBuilder", "symbols", "doc", "include")) {
            $p = Join-Path $pgsql $d
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          
          $dest = "electron\dist\pg-portable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item -Path "$pgsql\*" -Destination $dest
          if (-not (Test-Path "$dest\bin\initdb.exe")) { echo "::error::pg-portable 铺设失败: 缺 bin\initdb.exe"; exit 1 }
          $size = [math]::Round((Get-ChildItem $dest -Recurse | Measure-Object Length -Sum).Sum / 1MB, 0)
          echo "PG portable staged: $dest ($size MB)"

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          # 版本号单一数据源: electron/package.json
          # push tag 只做触发, 不作为版本来源 (历史 bug: ref_name=main 时 fallback 写死 2.0.8)
          $pkg = Get-Content "electron/package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          if (-not $version) { echo "ERROR: electron/package.json 缺少 version 字段"; exit 1 }
          echo "Building installer for version $version (source: electron/package.json)"
          
          # 如果是 tag 触发, 额外校验 tag 与 package.json 一致, 防止漏改版本号发车
          $refName = "${{ github.ref_name }}"
          if ($refName -like "v*") {
            $tagVersion = $refName.TrimStart("v")
            if ($tagVersion -ne $version) {
              echo "ERROR: tag $refName (=$tagVersion) 与 electron/package.json ($version) 不一致"
              echo "       请先同步 package.json / splash.html 再打 tag"
              exit 1
            }
            echo "Tag $refName matches package.json, OK."
          }
          
          $issFile = "electron\build\installer.iss"
          $content = Get-Content $issFile -Raw
          $content = $content -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText($issFile, $content, [System.Text.Encoding]::UTF8)
          echo "Converted ISS to CRLF + UTF-8"
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # v3.51.3: /DIncludePostgres 让 installer.iss 的 PG 可选组件真正编进安装包
          # (前置 Stage PostgreSQL portable 步骤已把文件铺到 dist\pg-portable\)
          & $iscc /DMyAppVersion="$version" /DIncludePostgres "electron\build\installer.iss"
          
          echo "=== Installer output ==="
          Get-ChildItem "electron\dist" -Filter "*.exe" | Select-Object Name, Length
          $setup = Get-ChildItem "electron\dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { echo "ERROR: Setup exe not found!"; exit 1 }
          echo "Installer: $($setup.Name) ($([math]::Round($setup.Length/1GB, 2)) GB)"
      
      - name: Upload installer as Action Artifact (不分包, 内部/团队下载用)
        uses: actions/upload-artifact@v4
        continue-on-error: true  # artifact 配额满不阻塞后续 Release 上传
        with:
          name: TianJun-AI-Vision-Installer
          path: electron/dist/TianJun-AI-Vision-*-Setup.exe
          retention-days: 30
          compression-level: 0

      - name: Split installer into parts (仅 tag 触发, 给 Release 用)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem "electron/dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setupFile) {
            Write-Error "Setup exe not found!"
            exit 1
          }

          Write-Host "Splitting $($setupFile.Name) ($([math]::Round($setupFile.Length / 1MB, 1)) MB)..."

          $partsDir = "release-parts"
          New-Item -ItemType Directory -Path $partsDir -Force | Out-Null

          $chunkSize = 1900 * 1024 * 1024  # 1.9 GB per chunk → 2 parts for a 3.75GB installer, stays under GitHub Release 2GB single-file limit
          $stream = [System.IO.File]::OpenRead($setupFile.FullName)
          $buffer = New-Object byte[] $chunkSize
          $partNum = 0

          while ($stream.Position -lt $stream.Length) {
              $bytesRead = $stream.Read($buffer, 0, $chunkSize)
              $partName = "{0}.part{1:D2}.part" -f $setupFile.Name, $partNum
              $partPath = Join-Path $partsDir $partName

              $fs = [System.IO.File]::OpenWrite($partPath)
              $fs.Write($buffer, 0, $bytesRead)
              $fs.Close()

              Write-Host "  Created: $partName ($([math]::Round($bytesRead / 1MB, 1)) MB)"
              $partNum++
          }
          $stream.Close()

          Write-Host "Total parts: $partNum"
          echo "TOTAL_PARTS=$partNum" >> $env:GITHUB_ENV

          # Compute SHA256 of original installer and each part
          $sha256 = (Get-FileHash $setupFile.FullName -Algorithm SHA256).Hash
          Write-Host "Installer SHA256: $sha256"
          $expectedSize = $setupFile.Length

          $partHashes = @{}
          $checksumLines = @()
          Get-ChildItem "$partsDir/*.part" | Sort-Object Name | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $partHashes[$_.Name] = $h
              $checksumLines += "$h  $($_.Name)"
              Write-Host "  $($_.Name) SHA256: $h"
          }
          $checksumLines | Out-File -FilePath "$partsDir/checksums.txt" -Encoding UTF8
          Write-Host "Checksums file created"

          # 生成通用合并脚本 merge_installer.bat
          # 历史踩坑 (每条都经过客户现场翻车):
          #   1. 不能嵌 powershell -Command "& {...}" 单行. BOM/引号/encoding 三连爆.
          #   2. 不能用 Out-File -Encoding UTF8 (PS 5.1 默认带 BOM, cmd 读第一行 @echo off 就炸).
          #   3. 不能硬编码版本号/文件名 (ref_name=main 时 fallback 2.0.8 会让 Action 路径也打错名).
          #   4. 不能 setlocal EnableDelayedExpansion + call :Label 联用 (参数展开诡异).
          #   5. echo 文本不能含 ( ) ! | & (if block 内会被 cmd 提前闭合, 报 "此时不应有 xxx").
          # 新版策略: 纯 cmd 内置命令 (copy /b + certutil + findstr), ASCII+CRLF+无 BOM.
          $batLines = @(
            '@echo off',
            'cd /d "%~dp0"',
            'title TianJun AI Vision - Merge Tool',
            '',
            'echo ============================================',
            'echo   TianJun AI Vision - Merge Tool',
            'echo ============================================',
            'echo.',
            'echo Working folder: %cd%',
            '',
            'rem --- 探测输出 exe 文件名 (不硬编码版本号, bat 通用) ---',
            'set "P0="',
            'for /f "delims=" %%f in (''dir /b *.part00.part 2^>nul'') do if not defined P0 set "P0=%%f"',
            'if not defined P0 goto NOFILES',
            'set "OUT=%P0:.part00.part=%"',
            '',
            'set PARTCOUNT=0',
            'for %%f in (*.part) do set /a PARTCOUNT+=1',
            '',
            'echo Output file:     %OUT%',
            'echo Parts found:     %PARTCOUNT%',
            'echo.',
            '',
            'if %PARTCOUNT% LSS 2 goto TOOFEW',
            '',
            'rem --- SHA256 校验 (best-effort, checksums 对不上只警告) ---',
            'set BAD=0',
            'set MISSING=0',
            'if not exist "checksums.txt" goto SKIPVERIFY',
            'echo Verifying SHA256 against checksums.txt ...',
            'echo.',
            'for /f "usebackq tokens=1,2" %%a in ("checksums.txt") do call :VERIFY "%%a" "%%b"',
            'if not "%MISSING%"=="0" (',
            '  echo.',
            '  echo [ERROR] %MISSING% part file missing on disk.',
            '  echo Re-download and put all parts in this folder.',
            '  goto FAILPAUSE',
            ')',
            'if not "%BAD%"=="0" (',
            '  echo.',
            '  echo [WARN] %BAD% part file failed SHA256 check.',
            '  echo Continuing merge anyway. If installer fails to run later,',
            '  echo re-download the [BAD] parts from the release page.',
            ')',
            'echo.',
            'goto DOMERGE',
            '',
            ':SKIPVERIFY',
            'echo [WARN] checksums.txt not found, skipping SHA256 verification.',
            'echo.',
            '',
            ':DOMERGE',
            'echo Merging %PARTCOUNT% parts into "%OUT%" ...',
            'if exist "%OUT%" del /f /q "%OUT%"',
            'set "ARGS="',
            'for /f "delims=" %%p in (''dir /b /o:n *.part'') do call :APPEND "%%p"',
            'if not defined ARGS goto NOFILES',
            'copy /b %ARGS% "%OUT%" >nul',
            'set "COPYERR=%errorlevel%"',
            'if not "%COPYERR%"=="0" goto MERGEFAIL',
            '',
            'echo.',
            'echo ============================================',
            'echo   Merge complete',
            'echo   File: %OUT%',
            'echo ============================================',
            'for %%i in ("%OUT%") do echo   Size: %%~zi bytes',
            'echo.',
            'echo Double-click the output file to install.',
            'echo.',
            'pause',
            'exit /b 0',
            '',
            ':APPEND',
            'if defined ARGS (',
            '  set "ARGS=%ARGS% + %~1"',
            ') else (',
            '  set "ARGS=%~1"',
            ')',
            'goto :eof',
            '',
            ':VERIFY',
            'if not exist %2 (',
            '  echo   [MISSING] %~2',
            '  set /a MISSING+=1',
            '  goto :eof',
            ')',
            'certutil -hashfile %2 SHA256 | findstr /i /c:%1 >nul',
            'if errorlevel 1 (',
            '  echo   [BAD]  %~2',
            '  set /a BAD+=1',
            '  goto :eof',
            ')',
            'echo   [OK]   %~2',
            'goto :eof',
            '',
            ':NOFILES',
            'echo [ERROR] No *.part00.part file in this folder.',
            'echo.',
            'echo Put ALL these files in the SAME folder as this script:',
            'echo   - every *.part file from the release page',
            'echo   - checksums.txt',
            'echo   - merge_installer.bat   ^<-- this script',
            'echo.',
            'echo Download page:',
            'echo   https://github.com/17373531860/tianjun-releases/releases',
            'goto FAILPAUSE',
            '',
            ':TOOFEW',
            'echo [ERROR] Only %PARTCOUNT% .part file found, at least 2 required.',
            'goto FAILPAUSE',
            '',
            ':MERGEFAIL',
            'echo.',
            'echo [ERROR] copy /b failed, exit code %COPYERR%.',
            'echo Possible causes: disk full, access denied, file in use.',
            'goto FAILPAUSE',
            '',
            ':FAILPAUSE',
            'echo.',
            'pause',
            'exit /b 1'
          )
          $batText = ($batLines -join "`r`n") + "`r`n"
          # 必须 ASCII + 无 BOM, 不要用 Out-File -Encoding UTF8
          [System.IO.File]::WriteAllBytes(
            (Join-Path $partsDir "merge_installer.bat"),
            [System.Text.Encoding]::ASCII.GetBytes($batText)
          )
          Write-Host "Merge script created (ASCII/CRLF/no-BOM, universal cross-version): merge_installer.bat"

          # List all files
          Write-Host "`nFiles in $partsDir :"
          Get-ChildItem $partsDir | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Upload parts to GitHub Release (tianjun-releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TARGET_REPO="17373531860/tianjun-releases"
          PARTS_DIR="release-parts"

          echo "=== Uploading v${VERSION} parts to ${TARGET_REPO} ==="
          echo "Files to upload:"
          ls -la "${PARTS_DIR}/"

          # Count expected files (parts + merge_installer.bat + checksums.txt)
          PART_COUNT=$(ls ${PARTS_DIR}/*.part 2>/dev/null | wc -l)
          EXPECTED_COUNT=$((PART_COUNT + 2))  # parts + merge_installer.bat + checksums.txt
          echo "Expected total files: ${EXPECTED_COUNT} (${PART_COUNT} parts + merge_installer.bat + checksums.txt)"

          cat > /tmp/release-notes.md << EOF
          ## ${VERSION} TianJun AI Vision 安装包

          安装包体积 3.75GB，超过 GitHub Release 单文件 2GB 上限，已拆分为 ${PART_COUNT} 个分卷。

          ### 下载步骤（重要：必须下载全部文件）
          请把以下 **${EXPECTED_COUNT} 个文件** 全部下载到 **同一个文件夹**：

          1. \`TianJun-AI-Vision-${VERSION#v}-Setup.exe.part00.part\`  （约 1.9 GB）
          2. \`TianJun-AI-Vision-${VERSION#v}-Setup.exe.part01.part\`  （约 1.9 GB）
          3. \`merge_installer.bat\`  （合并脚本）
          4. \`checksums.txt\`  （校验文件）

          ### 合并步骤
          1. 把上面 4 个文件都下载到 **同一个文件夹**
          2. 双击 \`merge_installer.bat\`
          3. 脚本会自动校验每个分卷的 SHA256，然后合并成 \`TianJun-AI-Vision-${VERSION#v}-Setup.exe\`
          4. 合并成功后双击 .exe 开始安装

          ### 常见问题
          - **提示 "No .part files found"**：所有文件必须放在同一文件夹（通常是下载后移到桌面新建文件夹）
          - **提示 "[BAD]"**：对应分卷下载损坏，重新下载该分卷即可
          - **提示 "SHA256 mismatch"**：下载过程中断或损坏，重新下载所有分卷

          ### 其他平台
          Ubuntu (deb) 与 macOS (dmg, arm64/Intel) 安装包由后续 job 追加上传到本 Release，
          超过 2GB 的会拆成 \`*.partNN.part\` 分卷，用 \`merge_installer.sh\` 合并（Linux/macOS 用 sh 脚本，不是 bat）。
          macOS 包暂未签名，首次启动请右键打开或 \`xattr -cr\` 放行。

          ### 更新内容
          见仓库 \`docs/changelog/${VERSION}_*.md\`
          EOF

          # Delete old release if exists (use --cleanup-tag so stale tag doesn't linger)
          echo "Deleting any existing ${VERSION} release on ${TARGET_REPO} ..."
          gh release delete "${VERSION}" --repo "${TARGET_REPO}" --yes --cleanup-tag 2>/dev/null || true

          # Create release and upload all files in release-parts/ at once (up to 2GB per file is fine)
          echo "Creating release ${VERSION} and uploading ${EXPECTED_COUNT} files..."
          gh release create "${VERSION}" \
            --repo "${TARGET_REPO}" \
            --title "${VERSION} - 天军科技AI视觉检测系统" \
            --notes-file /tmp/release-notes.md \
            "${PARTS_DIR}"/*.part \
            "${PARTS_DIR}/merge_installer.bat" \
            "${PARTS_DIR}/checksums.txt"

          echo ""
          echo "=== Verifying Release contents ==="
          # Retry up to 5 times because GitHub Release assets can lag briefly after upload
          for attempt in 1 2 3 4 5; do
            ACTUAL_COUNT=$(gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            echo "  Attempt ${attempt}: Release has ${ACTUAL_COUNT} / ${EXPECTED_COUNT} assets"
            if [ "$ACTUAL_COUNT" -eq "$EXPECTED_COUNT" ]; then
              break
            fi
            sleep 10
          done

          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: Release asset count mismatch. Expected $EXPECTED_COUNT, got $ACTUAL_COUNT"
            echo "Assets found:"
            gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets[].name'
            exit 1
          fi

          echo ""
          echo "=== All ${ACTUAL_COUNT} files uploaded successfully ==="
          gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets[] | "  \(.name)  \((.size/1024/1024*10|floor)/10) MB"'
          echo ""
          echo "Release URL: https://github.com/${TARGET_REPO}/releases/tag/${VERSION}"

  # ==================== Ubuntu (Linux x64) 安装包 ====================
  # 2026-09 多平台打包。与 build-windows 同构: Nuitka .so + conda-pack (linux-64,
  # CUDA cu128 + TensorRT 全量) + electron-builder deb。
  # 范围裁剪与必带组件 (改动前先看 docs/changelog 对应版说明):
  #   - 只出 deb。AppImage 对 5-6GB payload 的 squashfs 运行时挂载太慢,
  #     package.json 仍保留 AppImage target 供本地手动构建。
  #   - 海康 Linux SDK (2026-09 起必带): 用户确认为海康正式客户 (采购上千台),
  #     CI 从官方 legacy 直链铺进 backend/hcnetsdk/lib/ (extraResources **/*.so
  #     带出), wrapper.py 的 libhcnetsdk.so 分支即生效; 下载失败/铺设不全都红灯。
  #   - 嵌入式 PG (2026-09 起必带): zonky 16.15 便携包铺 pg-portable/ + 一次性
  #     初始化脚本 scripts/db/setup_embedded_pg.sh (语义对齐 Windows Inno 组件,
  #     Linux/macOS 由 electron/backend-manager.js 代管 pg_ctl start/stop,
  #     初始化失败回落 SQLite 不阻断)。
  build-linux:
    needs: test-gate
    if: always() && (needs.test-gate.result == 'success' || needs.test-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost /usr/local/share/chromium 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install system deps (opencv runtime + electron-builder deb 工具链)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 fakeroot patchelf

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic

      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          python --version

          echo "Installing PyTorch with CUDA 12.8 (linux wheels)..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128

          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt

          echo "Installing ONNX Runtime GPU..."
          pip install --retries 5 --timeout 60 onnxruntime-gpu

          echo "Installing TensorRT (锁 <11, 同 Windows 跑道)..."
          pip install --retries 5 --timeout 120 "tensorrt>=10.0,<11" --extra-index-url https://pypi.nvidia.com

          pip install --retries 5 --timeout 60 "scipy>=1.10.0"

          echo "Installing mediapipe (--no-deps, 同 Windows 跑道)..."
          pip install --retries 5 --timeout 60 --no-deps "mediapipe>=0.10.0,<0.10.21"
          pip install --retries 5 --timeout 60 absl-py attrs flatbuffers jax jaxlib matplotlib "protobuf>=4.25.3,<5" sounddevice sentencepiece

          echo "opencv/numpy ABI dance (同 Windows 跑道)..."
          pip uninstall opencv-python opencv-python-headless opencv-contrib-python -y 2>/dev/null || true
          pip install --retries 5 --timeout 60 --force-reinstall "numpy>=1.24.0,<2.0"
          pip install --retries 5 --timeout 60 --no-deps "opencv-contrib-python>=4.8.0,<4.11"
          pip install --retries 5 --timeout 60 conda-pack

          echo "Verifying installations..."
          python -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or (c or '').startswith('12.8'), f'FATAL: expected cu128, got {v} (CUDA {c})'"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
          python -c "import numpy as np; v=np.__version__; assert int(v.split('.')[0]) < 2, f'FATAL: numpy {v} >= 2.0'; print(f'NumPy: {v}')"
          python -c "import cv2, numpy as np; img=np.zeros((100,100,3),dtype=np.uint8); cv2.resize(img,(50,50)); print('OpenCV+NumPy ABI: OK')"
          python -c "import mediapipe; print(f'MediaPipe: {mediapipe.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}')"
          python -c "import cryptography, jsonschema; print('crypto deps OK')"

      - name: Compile Python backend with Nuitka (.so)
        shell: bash -l {0}
        run: |
          conda activate tianjun
          pip install --retries 5 --timeout 60 nuitka ordered-set

          # 与 build-windows 的 CORE_FILES 同一份白名单 — 改这里必须同步上面 Windows job
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/source_routes.py"
            "backend/api/source_per_item_mixin.py"
            "backend/api/source_session_lifecycle_mixin.py"
            "backend/api/source_settlement_mixin.py"
            "backend/api/source_tracking_mixin.py"
            "backend/api/source_periodic_actions_mixin.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/models.py"
            "backend/services/scanner.py"
            "backend/services/mes_hooks.py"
            "backend/services/weighing_engine.py"
          )

          for pyfile in "${CORE_FILES[@]}"; do
            if [ ! -f "$pyfile" ]; then
              echo "::error::CORE_FILES 白名单文件不存在: $pyfile （改名/删除后请同步 build.yml）"
              exit 1
            fi
          done

          for pyfile in "${CORE_FILES[@]}"; do
            dir=$(dirname "$pyfile")
            filename=$(basename "$pyfile" .py)
            echo "Compiling $pyfile ..."
            python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
            # Linux 产物是 <name>.cpython-310-x86_64-linux-gnu.so
            if ls "$dir"/${filename}*.so 1>/dev/null 2>&1; then
              echo "  -> Compiled successfully, removing source: $pyfile"
              rm -f "$pyfile"
            else
              echo "  -> Compilation failed, keeping source: $pyfile"
            fi
          done

          echo "Generated .so in backend/api/:"; ls -la backend/api/*.so 2>/dev/null || echo "  (none)"
          echo "Generated .so in backend/services/:"; ls -la backend/services/*.so 2>/dev/null || echo "  (none)"

      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          conda clean -a -y 2>/dev/null || true
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force --ignore-missing-files
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          du -sh python
          echo "Verifying packed environment..."
          python/bin/python -c "import torch; v=torch.__version__; print(f'Packed PyTorch: {v}'); assert 'cu128' in v or (torch.version.cuda or '').startswith('12.8')"
          python/bin/python -c "import cv2, numpy as np; img=np.zeros((10,10,3),dtype=np.uint8); cv2.resize(img,(5,5)); print('Packed OpenCV ABI: OK')"

      - name: Remove source conda env (释放 ~7GB 给 electron-builder)
        shell: bash -l {0}
        run: |
          conda deactivate 2>/dev/null || true
          conda env remove -n tianjun -y 2>/dev/null || rm -rf "$CONDA/envs/tianjun" || true
          df -h /

      - name: Download FFmpeg (linux64 GPL)
        run: |
          curl -sL --retry 5 -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p ffmpeg-temp ffmpeg
          tar -xJf ffmpeg.tar.xz -C ffmpeg-temp --strip-components=1
          cp ffmpeg-temp/bin/ffmpeg ffmpeg-temp/bin/ffprobe ffmpeg/
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          rm -rf ffmpeg-temp ffmpeg.tar.xz
          ./ffmpeg/ffmpeg -version | head -1

      - name: Stage HCNetSDK (Linux 64-bit, 海康正式客户随包分发)
        run: |
          # 2026-09: 用户确认为海康正式客户 (设备采购上千台), SDK 随包分发。
          # 官方 legacy/ca 站直链 2026-09-14 实测全部返回 HTML 拦截页 (CI+本机双确认),
          # 改从 GitHub 镜像仓库取 V6.1.9.4_build20220413 linux64 库集 (比官方直链的
          # 6.1.6.3 更新)。钉死 commit SHA 防上游供应链变动; 落地后校验 ELF magic。
          set -e
          SDK_REPO="Mr-LuXiaoHua/hikivision-sdk"
          SDK_SHA="96b86ad73d0e41f4f45432d3890ded6528574703"  # 2022-08-18 main
          curl -sL --http1.1 --retry 5 --max-time 900 -o hcnetsdk-mirror.tar.gz \
            "https://codeload.github.com/$SDK_REPO/tar.gz/$SDK_SHA"
          mkdir -p hcnetsdk-tmp && tar -xzf hcnetsdk-mirror.tar.gz -C hcnetsdk-tmp --strip-components=1
          SDK_LIB="hcnetsdk-tmp/lib/linux"
          [ -f "$SDK_LIB/libhcnetsdk.so" ] || { echo "::error::镜像仓库里找不到 lib/linux/libhcnetsdk.so — 阻断发版 (不允许静默发出无 NVR/工业相机支持的 Linux 包)"; exit 1; }
          # ELF magic 校验: 防拦截页/LFS 指针文件混进包
          MAGIC=$(head -c 4 "$SDK_LIB/libhcnetsdk.so" | od -An -tx1 | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "::error::libhcnetsdk.so 不是 ELF (magic=$MAGIC) — 阻断发版"; exit 1; }
          cp -a "$SDK_LIB"/. backend/hcnetsdk/lib/
          rm -rf hcnetsdk-tmp hcnetsdk-mirror.tar.gz
          for f in libhcnetsdk.so libPlayCtrl.so libHCCore.so HCNetSDKCom/libHCPreview.so; do
            [ -e "backend/hcnetsdk/lib/$f" ] || { echo "::error::铺设后缺 $f"; exit 1; }
          done
          echo "Staged SDK (V6.1.9.4):"; ls backend/hcnetsdk/lib/ | head -25

      - name: Stage PostgreSQL portable (zonky 16.15, 与 Windows PG 同版本)
        run: |
          set -e
          ART="embedded-postgres-binaries-linux-amd64"
          # repo1 对该机型偶发 HTTP/2 流中断 (本地实测 exit 16), 钉 http1.1
          curl -sL --http1.1 --retry 5 -o pg.jar \
            "https://repo1.maven.org/maven2/io/zonky/test/postgres/$ART/16.15.0/$ART-16.15.0.jar"
          unzip -q pg.jar -d pg-jar
          TXZ=$(ls pg-jar/*.txz | head -1)
          [ -n "$TXZ" ] || { echo "::error::zonky jar 里没有 txz"; exit 1; }
          rm -rf pg-portable && mkdir -p pg-portable
          tar -xJf "$TXZ" -C pg-portable
          rm -rf pg-jar pg.jar
          for b in initdb pg_ctl postgres; do
            [ -x "pg-portable/bin/$b" ] || { echo "::error::pg-portable 缺 bin/$b — 阻断发版"; exit 1; }
          done
          du -sh pg-portable

      - name: Smoke test embedded PG (真跑 setup_embedded_pg.sh)
        timeout-minutes: 10
        run: |
          sh scripts/db/setup_embedded_pg.sh --pg-root pg-portable --data-root "$RUNNER_TEMP/pg-smoke"
          test -f "$RUNNER_TEMP/pg-smoke/db_config.json"
          grep -q '"embedded_pg"' "$RUNNER_TEMP/pg-smoke/db_config.json"
          echo "setup 脚本冒烟通过:"; cat "$RUNNER_TEMP/pg-smoke/db_config.json" | sed 's/:[^:]*@/:***@/'
          rm -rf "$RUNNER_TEMP/pg-smoke"

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Electron App (deb)
        run: |
          # 版本一致性校验 (bash 版, 语义同 Windows job)
          VERSION=$(node -p "require('./electron/package.json').version")
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* && "${REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::tag $REF_NAME 与 electron/package.json ($VERSION) 不一致"
            exit 1
          fi
          cd electron
          npm ci
          npx electron-builder --linux deb --x64
          echo "=== dist ==="
          ls -la dist/ | grep -v unpacked || true
          DEB=$(ls dist/TianJun-AI-Vision-*-linux-x64.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "::error::deb 产物不存在"; exit 1; fi
          echo "deb: $DEB ($(du -h "$DEB" | cut -f1))"

      - name: Verify packaged resources (防资源漏打包自检)
        run: |
          BASE="electron/dist/linux-unpacked/resources"
          FAIL=0
          for f in \
            "$BASE/docs/plugin-system/plugin.schema.json" \
            "$BASE/docs/plugin-system/customer-codes.md" \
            "$BASE/backend/main.py" \
            "$BASE/scripts/db/sqlite_to_pg.py" \
            "$BASE/python/bin/python" \
            "$BASE/ffmpeg/ffmpeg" \
            "$BASE/app/dist/index.html"; do
            if [ -e "$f" ]; then echo "OK  $f"; else echo "::error::缺失打包资源: $f"; FAIL=1; fi
          done
          # Nuitka .so 进包抽查 (IP 保护有效性)
          if ls "$BASE"/backend/api/source.cpython-*.so >/dev/null 2>&1; then
            echo "OK  Nuitka .so 已进包"
          else
            echo "::warning::backend/api/source*.so 未进包 — Nuitka 编译可能失败, 核心 IP 以源码出厂"
          fi
          # 海康 Linux SDK (2026-09 起必带组件 — 正式客户随包分发, 缺失=阻断)
          for f in "$BASE/backend/hcnetsdk/lib/libhcnetsdk.so" "$BASE/backend/hcnetsdk/lib/libPlayCtrl.so"; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "::error::缺失海康 SDK: $f"; FAIL=1; fi
          done
          # 嵌入式 PG (2026-09 起必带组件, 血泪教训 v3.49~v3.51.2: 组件写了没进包三个版本没人发现)
          for f in "$BASE/pg-portable/bin/pg_ctl" "$BASE/pg-portable/bin/initdb" "$BASE/pg-portable/bin/postgres" "$BASE/scripts/db/setup_embedded_pg.sh"; do
            if [ -e "$f" ]; then echo "OK  $f"; else echo "::error::缺失嵌入式 PG 组件: $f"; FAIL=1; fi
          done
          # app.asar 关键文件
          ASAR_LIST=$(npx --yes asar list "$BASE/app.asar")
          for f in "splash.html" "splash/index.html" "main.js"; do
            if echo "$ASAR_LIST" | grep -q "$f"; then echo "OK  asar: $f"; else echo "::error::app.asar 缺失: $f"; FAIL=1; fi
          done
          [ "$FAIL" -eq 0 ] || { echo "打包资源自检未通过 — 阻断发版"; exit 1; }

      - name: Smoke test packed backend (打包布局上真 import)
        run: |
          cd electron/dist/linux-unpacked/resources
          export TIANJUN_DATA_DIR="$RUNNER_TEMP/tj-smoke"
          export BACKEND_SKIP_INIT=1
          export TIANJUN_TEST_MODE=1
          mkdir -p "$TIANJUN_DATA_DIR"
          # os._exit(0) 硬退出: torch/mediapipe 组合在解释器 finalize 阶段可能挂死
          # (本机 2026-09-14 实锤: import 成功后卡 Py_FinalizeEx 250s+), 验证点只是 import 成功
          ./python/bin/python -c "import backend.main; print('packed backend import OK (Nuitka .so 加载通过)', flush=True); import os; os._exit(0)"

      - name: Upload deb as Action Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TianJun-AI-Vision-Linux-x64-deb
          path: electron/dist/TianJun-AI-Vision-*-linux-x64.deb
          retention-days: 30
          compression-level: 0

  # ==================== macOS 安装包 (arm64 + Intel x64) ====================
  # 2026-09 多平台打包。macOS 是能力子集版 (无 CUDA/TensorRT/海康 SDK — 海康无
  # macOS 版 SDK, NVR/工业相机功能缺失属平台限制):
  #   - 推理走 MPS (arm64, v3.46 起支持) / CPU (Intel x64)
  #   - 嵌入式 PG 必带 (zonky 16.15 darwin 便携包, 同 Linux 方案:
  #     setup_embedded_pg.sh 初始化 + backend-manager 代管 pg_ctl)
  #   - Intel 注意: PyTorch 官方从 2.3 起不再发 macOS x86_64 wheel,
  #     x64 包会解析到 torch 2.2.2 (最后一个 Intel mac 版本), 属预期
  #   - 暂不做 Apple 签名/公证 (identity=null, ad-hoc 签名), 客户侧首启需
  #     右键打开或 xattr -cr 放行 Gatekeeper — 正式对外分发前需补签名
  build-macos:
    needs: test-gate
    if: always() && (needs.test-gate.result == 'success' || needs.test-gate.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      PIP_NO_CACHE_DIR: '1'
      # 不签名: 阻止 electron-builder 自动发现钥匙串身份
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic

      - name: Install Python dependencies (macOS 无 CUDA/TensorRT)
        shell: bash -l {0}
        run: |
          conda activate tianjun
          python --version

          echo "Installing PyTorch (默认 index; arm64=MPS, x64 解析到 2.2.2 CPU)..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio

          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt

          pip install --retries 5 --timeout 60 "scipy>=1.10.0"

          echo "Installing mediapipe (--no-deps, universal2 wheel 覆盖双架构)..."
          pip install --retries 5 --timeout 60 --no-deps "mediapipe>=0.10.0,<0.10.21"
          pip install --retries 5 --timeout 60 absl-py attrs flatbuffers jax jaxlib matplotlib "protobuf>=4.25.3,<5" sounddevice sentencepiece

          echo "opencv/numpy ABI dance (同 Windows 跑道)..."
          pip uninstall opencv-python opencv-python-headless opencv-contrib-python -y 2>/dev/null || true
          pip install --retries 5 --timeout 60 --force-reinstall "numpy>=1.24.0,<2.0"
          pip install --retries 5 --timeout 60 --no-deps "opencv-contrib-python>=4.8.0,<4.11"
          pip install --retries 5 --timeout 60 conda-pack

          echo "Verifying installations..."
          python -c "import torch; print(f'PyTorch: {torch.__version__}, MPS built: {torch.backends.mps.is_built()}')"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            python -c "import torch; assert torch.backends.mps.is_built(), 'FATAL: arm64 包必须带 MPS 支持'"
          fi
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
          python -c "import numpy as np; v=np.__version__; assert int(v.split('.')[0]) < 2, f'FATAL: numpy {v} >= 2.0'; print(f'NumPy: {v}')"
          python -c "import cv2, numpy as np; img=np.zeros((100,100,3),dtype=np.uint8); cv2.resize(img,(50,50)); print('OpenCV+NumPy ABI: OK')"
          python -c "import mediapipe; print(f'MediaPipe: {mediapipe.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}')"
          python -c "import cryptography, jsonschema; print('crypto deps OK')"

      - name: Compile Python backend with Nuitka (.so)
        shell: bash -l {0}
        run: |
          conda activate tianjun
          pip install --retries 5 --timeout 60 nuitka ordered-set

          # 与 build-windows 的 CORE_FILES 同一份白名单 — 改这里必须同步上面 Windows job
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/source_routes.py"
            "backend/api/source_per_item_mixin.py"
            "backend/api/source_session_lifecycle_mixin.py"
            "backend/api/source_settlement_mixin.py"
            "backend/api/source_tracking_mixin.py"
            "backend/api/source_periodic_actions_mixin.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/models.py"
            "backend/services/scanner.py"
            "backend/services/mes_hooks.py"
            "backend/services/weighing_engine.py"
          )

          for pyfile in "${CORE_FILES[@]}"; do
            if [ ! -f "$pyfile" ]; then
              echo "::error::CORE_FILES 白名单文件不存在: $pyfile"
              exit 1
            fi
          done

          for pyfile in "${CORE_FILES[@]}"; do
            dir=$(dirname "$pyfile")
            filename=$(basename "$pyfile" .py)
            echo "Compiling $pyfile ..."
            python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
            # macOS 产物是 <name>.cpython-310-darwin.so
            if ls "$dir"/${filename}*.so 1>/dev/null 2>&1; then
              echo "  -> Compiled successfully, removing source: $pyfile"
              rm -f "$pyfile"
            else
              echo "  -> Compilation failed, keeping source: $pyfile"
            fi
          done

          echo "Generated .so in backend/api/:"; ls -la backend/api/*.so 2>/dev/null || echo "  (none)"
          echo "Generated .so in backend/services/:"; ls -la backend/services/*.so 2>/dev/null || echo "  (none)"

      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          conda clean -a -y 2>/dev/null || true
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force --ignore-missing-files
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          du -sh python
          echo "Verifying packed environment..."
          python/bin/python -c "import torch; print(f'Packed PyTorch: {torch.__version__}')"
          python/bin/python -c "import cv2, numpy as np; img=np.zeros((10,10,3),dtype=np.uint8); cv2.resize(img,(5,5)); print('Packed OpenCV ABI: OK')"

      - name: Download FFmpeg (macOS ${{ matrix.arch }}, 含 x264 的 GPL 静态构建)
        run: |
          # martin-riedl.de: 静态构建带 x264/x265, 与 Windows 跑道的 BtbN GPL 能力对齐;
          # 二进制已签名。注意 redirect 端点不支持 HEAD, 必须 GET。
          ARCH="${{ matrix.arch }}"
          [ "$ARCH" = "x64" ] && ARCH="amd64"
          mkdir -p ffmpeg
          for tool in ffmpeg ffprobe; do
            curl -sL --http1.1 --retry 5 -o "$tool.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$ARCH/release/$tool.zip"
            unzip -o "$tool.zip" -d ffmpeg
            rm "$tool.zip"
          done
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          ./ffmpeg/ffmpeg -version | head -1

      - name: Stage PostgreSQL portable (zonky 16.15 darwin, 与 Windows/Linux 同版本)
        run: |
          set -e
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "arm64" ]; then ART="embedded-postgres-binaries-darwin-arm64v8"; else ART="embedded-postgres-binaries-darwin-amd64"; fi
          curl -sL --http1.1 --retry 5 -o pg.jar \
            "https://repo1.maven.org/maven2/io/zonky/test/postgres/$ART/16.15.0/$ART-16.15.0.jar"
          unzip -q pg.jar -d pg-jar
          TXZ=$(ls pg-jar/*.txz | head -1)
          [ -n "$TXZ" ] || { echo "::error::zonky jar 里没有 txz"; exit 1; }
          rm -rf pg-portable && mkdir -p pg-portable
          tar -xJf "$TXZ" -C pg-portable
          rm -rf pg-jar pg.jar
          for b in initdb pg_ctl postgres; do
            [ -x "pg-portable/bin/$b" ] || { echo "::error::pg-portable 缺 bin/$b — 阻断发版"; exit 1; }
          done
          du -sh pg-portable

      - name: Smoke test embedded PG (真跑 setup_embedded_pg.sh)
        timeout-minutes: 10
        run: |
          sh scripts/db/setup_embedded_pg.sh --pg-root pg-portable --data-root "$RUNNER_TEMP/pg-smoke"
          test -f "$RUNNER_TEMP/pg-smoke/db_config.json"
          grep -q '"embedded_pg"' "$RUNNER_TEMP/pg-smoke/db_config.json"
          echo "setup 脚本冒烟通过:"; cat "$RUNNER_TEMP/pg-smoke/db_config.json" | sed 's/:[^:]*@/:***@/'
          rm -rf "$RUNNER_TEMP/pg-smoke"

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Electron App (dmg, 未签名/ad-hoc)
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* && "${REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::tag $REF_NAME 与 electron/package.json ($VERSION) 不一致"
            exit 1
          fi
          cd electron
          npm ci
          npx electron-builder --mac dmg --${{ matrix.arch }}
          echo "=== dist ==="
          ls -la dist/*.dmg
          DMG=$(ls dist/TianJun-AI-Vision-*-mac-${{ matrix.arch }}.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "::error::dmg 产物不存在"; exit 1; fi
          echo "dmg: $DMG ($(du -h "$DMG" | cut -f1))"

      - name: Verify packaged resources (防资源漏打包自检)
        run: |
          # mac 解包目录: dist/mac-arm64 或 dist/mac (x64), app 名含中文用 glob
          APP_RES=$(ls -d electron/dist/mac*/*.app/Contents/Resources 2>/dev/null | head -1)
          if [ -z "$APP_RES" ]; then echo "::error::找不到 .app/Contents/Resources"; exit 1; fi
          echo "APP_RES=$APP_RES"
          FAIL=0
          for f in \
            "$APP_RES/docs/plugin-system/plugin.schema.json" \
            "$APP_RES/docs/plugin-system/customer-codes.md" \
            "$APP_RES/backend/main.py" \
            "$APP_RES/scripts/db/sqlite_to_pg.py" \
            "$APP_RES/scripts/db/setup_embedded_pg.sh" \
            "$APP_RES/pg-portable/bin/pg_ctl" \
            "$APP_RES/pg-portable/bin/initdb" \
            "$APP_RES/pg-portable/bin/postgres" \
            "$APP_RES/python/bin/python" \
            "$APP_RES/ffmpeg/ffmpeg" \
            "$APP_RES/app/dist/index.html"; do
            if [ -e "$f" ]; then echo "OK  $f"; else echo "::error::缺失打包资源: $f"; FAIL=1; fi
          done
          if ls "$APP_RES"/backend/api/source.cpython-*.so >/dev/null 2>&1; then
            echo "OK  Nuitka .so 已进包"
          else
            echo "::warning::backend/api/source*.so 未进包 — Nuitka 编译可能失败, 核心 IP 以源码出厂"
          fi
          ASAR_LIST=$(npx --yes asar list "$APP_RES/app.asar")
          for f in "splash.html" "splash/index.html" "main.js"; do
            if echo "$ASAR_LIST" | grep -q "$f"; then echo "OK  asar: $f"; else echo "::error::app.asar 缺失: $f"; FAIL=1; fi
          done
          [ "$FAIL" -eq 0 ] || { echo "打包资源自检未通过 — 阻断发版"; exit 1; }

      - name: Smoke test packed backend (打包布局上真 import)
        run: |
          APP_RES=$(ls -d electron/dist/mac*/*.app/Contents/Resources 2>/dev/null | head -1)
          cd "$APP_RES"
          export TIANJUN_DATA_DIR="$RUNNER_TEMP/tj-smoke"
          export BACKEND_SKIP_INIT=1
          export TIANJUN_TEST_MODE=1
          mkdir -p "$TIANJUN_DATA_DIR"
          # os._exit(0) 硬退出: torch/mediapipe 组合在解释器 finalize 阶段可能挂死
          # (本机 2026-09-14 实锤: import 成功后卡 Py_FinalizeEx 250s+), 验证点只是 import 成功
          ./python/bin/python -c "import backend.main; print('packed backend import OK (Nuitka .so 加载通过)', flush=True); import os; os._exit(0)"

      - name: Upload dmg as Action Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TianJun-AI-Vision-macOS-${{ matrix.arch }}-dmg
          path: electron/dist/TianJun-AI-Vision-*-mac-${{ matrix.arch }}.dmg
          retention-days: 30
          compression-level: 0

  # ==================== 非 Windows 产物上传 Release (仅 tag) ====================
  # 设计说明: Release 的创建/删除权在 build-windows (含 --cleanup-tag 清场)。
  # 本 job needs 全部构建 job, 在 Windows 建好 release 之后追加上传 deb/dmg,
  # 从结构上消除"两个 job 同时 create 同名 release"的竞态。
  # Windows 失败时兜底自建 release (只含非 Windows 资产, 属降级交付)。
  release-upload-nonwin:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download non-Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'TianJun-AI-Vision-{Linux,macOS}*'
          path: nonwin-dist
          merge-multiple: true

      - name: Split large files + 生成 sh 合并脚本 + 上传 Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TARGET_REPO="17373531860/tianjun-releases"
          OUT="release-parts-nonwin"
          mkdir -p "$OUT"

          echo "=== artifacts 到位情况 ==="
          ls -la nonwin-dist/ || true
          COUNT=$(ls nonwin-dist/ 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::没有任何非 Windows 产物 (构建 job 可能全部失败), 跳过上传"
            exit 0
          fi

          # >1.9GB 的切分卷 (与 Windows 同一命名约定 *.partNN.part), 小文件整传
          LIMIT=$((1900 * 1024 * 1024))
          for f in nonwin-dist/*; do
            name=$(basename "$f")
            size=$(stat -c %s "$f")
            if [ "$size" -gt "$LIMIT" ]; then
              echo "Splitting $name ($((size / 1024 / 1024)) MB)..."
              split -b 1900m -d -a 2 "$f" "$OUT/$name.part"
              for p in "$OUT/$name".part[0-9][0-9]; do mv "$p" "$p.part"; done
            else
              cp "$f" "$OUT/"
            fi
          done

          # 分卷校验文件 (与 Windows 的 checksums.txt 区分命名, 避免同 release 撞名)
          cd "$OUT"
          if ls *.part >/dev/null 2>&1; then
            sha256sum *.part > checksums-nonwin.txt
          fi

          # POSIX sh 合并脚本 (Ubuntu / macOS 通用; bat 的 CRLF 军规不适用于 sh — 必须 LF)
          cat > merge_installer.sh << 'MERGE_EOF'
          #!/bin/sh
          # TianJun AI Vision - Linux/macOS 分卷合并脚本
          # 用法: 把所有 .part 文件 + checksums-nonwin.txt + 本脚本放同一目录, 然后:
          #   sh merge_installer.sh
          cd "$(dirname "$0")" || exit 1
          if command -v sha256sum >/dev/null 2>&1; then SHA="sha256sum"; else SHA="shasum -a 256"; fi
          if [ -f checksums-nonwin.txt ]; then
            echo "Verifying SHA256..."
            $SHA -c checksums-nonwin.txt || {
              echo "[WARN] 部分分卷校验失败, 继续合并; 若安装失败请重新下载对应分卷"
            }
          fi
          found=0
          for first in *.part00.part; do
            [ -e "$first" ] || continue
            found=1
            out="${first%.part00.part}"
            echo "Merging -> $out"
            rm -f "$out"
            cat "$out".part[0-9][0-9].part > "$out"
            echo "  Done: $(du -h "$out" | cut -f1)"
          done
          if [ "$found" -eq 0 ]; then
            echo "[ERROR] 当前目录没有 *.part00.part 分卷文件"
            exit 1
          fi
          echo "合并完成。deb: sudo apt install ./<文件名>; dmg: 双击挂载后拖入应用程序。"
          echo "macOS 未签名包首启: 右键打开, 或 xattr -cr /Applications/<App 名>.app"
          MERGE_EOF
          chmod +x merge_installer.sh
          cd ..

          echo "=== 待上传文件 ==="
          ls -la "$OUT/"

          # release 应已由 build-windows 创建; 不存在则兜底自建 (Windows 失败的降级交付)
          if ! gh release view "$VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "::warning::release $VERSION 不存在 (build-windows 可能失败), 兜底创建"
            gh release create "$VERSION" --repo "$TARGET_REPO" \
              --title "$VERSION - 天军科技AI视觉检测系统" \
              --notes "$VERSION 多平台安装包。Windows 包缺失 (构建失败), 本次仅含 Ubuntu/macOS 产物。分卷用 merge_installer.sh 合并。"
          fi

          gh release upload "$VERSION" --repo "$TARGET_REPO" --clobber "$OUT"/*

          echo "=== Release 资产清单 ==="
          gh release view "$VERSION" --repo "$TARGET_REPO" --json assets --jq '.assets[] | "  \(.name)  \((.size/1024/1024*10|floor)/10) MB"'
