name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic
      
      - name: Configure conda for stability
        shell: bash -l {0}
        run: |
          conda config --set remote_connect_timeout_secs 60
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --show
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Python version:"
          python --version
          
          echo "Installing PyTorch with CUDA 12.1..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
          
          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt
          
          echo "Installing conda-pack..."
          pip install --retries 5 --timeout 60 conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; print(f'PyTorch: {torch.__version__}, CUDA: {torch.version.cuda}')"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
      
      - name: Compile Python backend with Nuitka
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Installing Nuitka..."
          pip install --retries 5 --timeout 60 nuitka ordered-set
          
          echo "=== Compiling core backend files to .pyd ==="
          
          # Core business logic files
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/detection.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/websocket.py"
            "backend/api/models.py"
            "backend/services/detector.py"
          )
          
          for pyfile in "${CORE_FILES[@]}"; do
            if [ -f "$pyfile" ]; then
              dir=$(dirname "$pyfile")
              filename=$(basename "$pyfile" .py)
              echo "Compiling $pyfile ..."
              python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
              
              # If .pyd was generated, remove the .py source
              if ls "$dir"/${filename}*.pyd 1>/dev/null 2>&1; then
                echo "  -> Compiled successfully, removing source: $pyfile"
                rm -f "$pyfile"
              else
                echo "  -> Compilation failed, keeping source: $pyfile"
              fi
            fi
          done
          
          echo "=== Compilation complete ==="
          echo "Remaining .py files in backend/api/:"
          ls -la backend/api/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/api/:"
          ls -la backend/api/*.pyd 2>/dev/null || echo "  (none)"
          echo "Remaining .py files in backend/services/:"
          ls -la backend/services/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/services/:"
          ls -la backend/services/*.pyd 2>/dev/null || echo "  (none)"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Packing conda environment..."
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
      
      - name: Download FFmpeg
        shell: pwsh
        run: |
          echo "Downloading FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Path "ffmpeg" -Force
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg/"
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "ffmpeg/"
          Remove-Item -Path "ffmpeg-temp" -Recurse -Force
          Remove-Item -Path "ffmpeg.zip" -Force
          echo "FFmpeg downloaded:"
          Get-ChildItem ffmpeg
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Verify resources before build
        shell: pwsh
        run: |
          echo "=== Checking required resources ==="
          echo "Frontend dist:"
          Test-Path "frontend/dist" 
          Get-ChildItem "frontend/dist" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Backend:"
          Test-Path "backend"
          echo "Python env:"
          Test-Path "python-env/python"
          echo "FFmpeg:"
          Test-Path "ffmpeg"
          Get-ChildItem "ffmpeg" -ErrorAction SilentlyContinue | Select-Object Name
      
      - name: Build Electron App
        shell: pwsh
        run: |
          cd electron
          npm ci
          echo "Starting electron-builder..."
          npx electron-builder --win --x64 2>&1
          echo "=== Build completed, listing all files ==="
          echo "--- electron/ root ---"
          Get-ChildItem -ErrorAction SilentlyContinue | Select-Object Name
          echo "--- electron/dist/ ---"
          Get-ChildItem "dist" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          echo "--- Looking for .exe anywhere ---"
          Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName
      
      - name: Upload Release to tianjun-releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Creating release ${VERSION} on tianjun-releases..."

          SETUP_FILE=$(find electron/dist -name "TianJun-AI-Vision-*-Setup.exe" -type f | head -1)

          if [ -z "$SETUP_FILE" ]; then
            echo "ERROR: Setup exe not found!"
            ls -la electron/dist/
            exit 1
          fi

          echo "Found installer: $SETUP_FILE"
          echo "SETUP_FILE=$SETUP_FILE" >> $GITHUB_ENV

          cat > /tmp/release-notes.md << 'EOF'
          ## v2.0.4 更新内容

          ### Bug 修复
          - **修复跟踪模式消失确认帧数不生效**：all_gone 策略下 gone_confirm_frames 计数器因 prev_count 条件在第 2 帧被重置，导致消失确认无法正常累加
          - **修复跟踪模式 re-ID 超时硬编码**：max_lost_sec 从硬编码 5.0s 改为取各类别最大值，避免高容忍类别 re-ID 过早失效导致重复计数
          - **修复项目设置保存后不生效**：settlement_mode 等 pipeline_config 字段保存后未同步到内存，需刷新页面才生效
          - **修复 DB 连接泄漏**：record_step 异常路径未关闭 DB session，长时间运行会耗尽连接池
          - **修复多通道跟踪 YAML 竞争**：ByteTrack 自定义配置文件改为每实例唯一文件名

          ### 功能改进
          - **CSV 导出增加日期**：开始时间字段从 HH:MM:SS 改为 YYYY-MM-DD HH:MM:SS，支持跨日分析
          - **RTSP 连接验证增强**：start_rtsp 增加 30 次帧读取验证，失败时提示编码信息和建议
          - **前端 RTSP 提示优化**：输入框提示区分主码流/子码流，推荐 720p 子码流
          - **跟踪模式调试日志**：遮挡容忍超时、消失确认倒计时等关键事件增加终端日志

          ### 安装说明
          1. 下载 .exe 安装程序
          2. 双击运行安装
          3. 按提示完成安装
          4. 首次运行需安装 VC++ 运行时库（如未安装）
          5. **从旧版本升级会自动备份数据库和历史数据**
          EOF

          gh release delete "${VERSION}" --repo 17373531860/tianjun-releases --yes 2>/dev/null || true

          gh release create "${VERSION}" \
            --repo 17373531860/tianjun-releases \
            --title "${VERSION} - 天军科技AI视觉检测系统" \
            --notes-file /tmp/release-notes.md \
            "$SETUP_FILE"

          echo "Release created successfully!"

      - name: Split installer for Gitee
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem "electron/dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setupFile) {
            Write-Error "Setup exe not found!"
            exit 1
          }

          Write-Host "Splitting $($setupFile.Name) ($([math]::Round($setupFile.Length / 1MB, 1)) MB)..."

          $partsDir = "gitee-parts"
          New-Item -ItemType Directory -Path $partsDir -Force | Out-Null

          $chunkSize = 50 * 1024 * 1024  # 50MB per chunk (Gitee API enforces ~100MB but often fails above 50MB)
          $stream = [System.IO.File]::OpenRead($setupFile.FullName)
          $buffer = New-Object byte[] $chunkSize
          $partNum = 0

          while ($stream.Position -lt $stream.Length) {
              $bytesRead = $stream.Read($buffer, 0, $chunkSize)
              $partName = "{0}.part{1:D2}.part" -f $setupFile.Name, $partNum
              $partPath = Join-Path $partsDir $partName

              $fs = [System.IO.File]::OpenWrite($partPath)
              $fs.Write($buffer, 0, $bytesRead)
              $fs.Close()

              Write-Host "  Created: $partName ($([math]::Round($bytesRead / 1MB, 1)) MB)"
              $partNum++
          }
          $stream.Close()

          Write-Host "Total parts: $partNum"
          echo "TOTAL_PARTS=$partNum" >> $env:GITHUB_ENV

          # Generate merge script
          $version = "${{ github.ref_name }}"
          $exeName = $setupFile.Name
          $batContent = @"
          @echo off
          chcp 65001 >nul
          setlocal enabledelayedexpansion
          echo ============================================
          echo   天军科技AI视觉检测系统 - 安装包合并工具
          echo   版本: $version
          echo ============================================
          echo.
          echo 正在合并安装包文件，请稍候...
          echo.

          set "output=$exeName"
          if exist "%output%" del /f "%output%"

          set "count=0"
          set "cmd=copy /b"
          set "first=1"

          for /f "delims=" %%f in ('dir /b /o:n *.part 2^>nul') do (
              set /a count+=1
              if !first!==1 (
                  set "cmd=!cmd! "%%f""
                  set "first=0"
              ) else (
                  set "cmd=!cmd!+"%%f""
              )
          )

          if !count!==0 (
              echo [错误] 当前目录下没有找到 .part 文件！
              echo 请确保从两个仓库下载的所有 .part 文件都放在同一个文件夹中。
              echo.
              echo 下载地址：
              echo   第一部分: https://gitee.com/xu-yanzhi32/tianjun-releases/releases
              echo   Part 2: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases
              pause
              exit /b 1
          )

          set "cmd=!cmd! "%output%""
          echo 找到 !count! 个分块文件，正在合并...
          !cmd! >nul

          if exist "%output%" (
              echo.
              echo ============================================
              echo   合并成功！
              echo   安装程序: %output%
              echo ============================================
              echo.
              echo 请双击运行安装程序进行安装。
          ) else (
              echo.
              echo [错误] 合并失败，请检查文件是否完整。
          )

          pause
          "@

          $batContent | Out-File -FilePath "$partsDir/merge_installer.bat" -Encoding Default
          Write-Host "Merge script created: merge_installer.bat"

          # List all files
          Write-Host "`nFiles in $partsDir :"
          Get-ChildItem $partsDir | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Clean ALL old Gitee releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for REPO in tianjun-releases tianjun-releases-2; do
            echo "=== Cleaning all releases from $REPO ==="
            RELEASES=$(curl -s "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null)
            IDS=$(echo "$RELEASES" | python3 -c "
          import sys, json
          for r in json.load(sys.stdin):
              print(r['id'])
          " 2>/dev/null || echo "")
            for RID in $IDS; do
              echo "  Deleting release $RID from $REPO..."
              curl -s -X DELETE "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RID}?access_token=${GITEE_TOKEN}"
              sleep 1
            done
          done
          echo "Waiting 10s for quota to settle..."
          sleep 10

      - name: Upload to Gitee (repo 1 - first batch)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TOTAL_PARTS="${TOTAL_PARTS}"
          HALF=$(( (TOTAL_PARTS + 1) / 2 ))

          echo "Total parts: $TOTAL_PARTS, Repo 1 gets: parts 00 to $(printf '%02d' $((HALF - 1)))"

          upload_file() {
            local REPO="$1" RELEASE_ID="$2" FILE_PATH="$3"
            local FNAME=$(basename "$FILE_PATH")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 600 \
                -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE_PATH}")
              if [ "$HTTP_CODE" = "201" ]; then
                RESP_NAME=$(python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('name',''))" 2>/dev/null || echo "$FNAME")
                echo "  OK: $RESP_NAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('message','unknown error'))" 2>/dev/null || true
              sleep 5
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${VERSION} on tianjun-releases..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${VERSION}',
            'name': '${VERSION} TianJun AI Vision (Part 1)',
            'body': '## ${VERSION} TianJun AI Vision (Part 1)\n\nDownload Part 2: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases/tag/${VERSION}-part2\n\n### How to use\n1. Download all .part files and merge_installer.bat from this page\n2. Download all .part files from Part 2\n3. Put all files in the same folder\n4. Run merge_installer.bat\n5. Run the merged installer',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_release_body.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/tianjun-releases/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_release_body.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created with ID: $RELEASE_ID"

          # Upload merge script
          echo "Uploading merge script..."
          upload_file "tianjun-releases" "$RELEASE_ID" "gitee-parts/merge_installer.bat" || echo "Warning: merge script upload failed, continuing..."

          # Upload first batch of parts
          FAIL_COUNT=0
          for i in $(seq 0 $((HALF - 1))); do
            PART_NAME=$(printf "*.part%02d.part" $i)
            PART_FILE=$(ls gitee-parts/$PART_NAME 2>/dev/null | head -1)
            if [ -n "$PART_FILE" ]; then
              echo "Uploading $(basename $PART_FILE)..."
              upload_file "tianjun-releases" "$RELEASE_ID" "$PART_FILE" || FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "Repo 1 upload complete! (failures: $FAIL_COUNT)"

      - name: Upload to Gitee (repo 2 - second batch)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TOTAL_PARTS="${TOTAL_PARTS}"
          HALF=$(( (TOTAL_PARTS + 1) / 2 ))

          if [ "$HALF" -ge "$TOTAL_PARTS" ]; then
            echo "All parts fit in repo 1, skipping repo 2."
            exit 0
          fi

          echo "Repo 2 gets: parts $(printf '%02d' $HALF) to $(printf '%02d' $((TOTAL_PARTS - 1)))"

          upload_file() {
            local REPO="$1" RELEASE_ID="$2" FILE_PATH="$3"
            local FNAME=$(basename "$FILE_PATH")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 600 \
                -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/${REPO}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE_PATH}")
              if [ "$HTTP_CODE" = "201" ]; then
                RESP_NAME=$(python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('name',''))" 2>/dev/null || echo "$FNAME")
                echo "  OK: $RESP_NAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              python3 -c "import json; d=json.load(open('/tmp/gitee_resp.json',encoding='utf-8')); print(d.get('message','unknown error'))" 2>/dev/null || true
              sleep 5
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          TAG2="${VERSION}-part2"
          echo "Creating release ${TAG2} on tianjun-releases-2..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${TAG2}',
            'name': '${VERSION} TianJun AI Vision (Part 2)',
            'body': '## ${VERSION} TianJun AI Vision (Part 2)\n\nDownload Part 1: https://gitee.com/xu-yanzhi32/tianjun-releases/releases/tag/${VERSION}\n\nPut all .part files together with Part 1 files, then run merge_installer.bat from Part 1.',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_release_body2.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/xu-yanzhi32/tianjun-releases-2/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_release_body2.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release on repo 2!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created with ID: $RELEASE_ID"

          # Upload second batch of parts
          FAIL_COUNT=0
          for i in $(seq $HALF $((TOTAL_PARTS - 1))); do
            PART_NAME=$(printf "*.part%02d.part" $i)
            PART_FILE=$(ls gitee-parts/$PART_NAME 2>/dev/null | head -1)
            if [ -n "$PART_FILE" ]; then
              echo "Uploading $(basename $PART_FILE)..."
              upload_file "tianjun-releases-2" "$RELEASE_ID" "$PART_FILE" || FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "Repo 2 upload complete! (failures: $FAIL_COUNT)"
          echo ""
          echo "=== Gitee Release URLs ==="
          echo "Part 1: https://gitee.com/xu-yanzhi32/tianjun-releases/releases/tag/${VERSION}"
          echo "Part 2: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases/tag/${VERSION}-part2"
