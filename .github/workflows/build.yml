name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          auto-activate-base: false
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          echo "Installing PyTorch with CUDA 12.1..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
          
          echo "Installing backend dependencies..."
          pip install -r backend/requirements.txt
          
          echo "Installing conda-pack..."
          pip install conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; print(f'PyTorch: {torch.__version__}, CUDA: {torch.version.cuda}')"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          echo "Packing conda environment..."
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Build Electron App
        run: |
          cd electron
          npm ci
          npm run build:win
          echo "Electron build completed"
          dir dist
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: TianjunAI-Windows-Installer
          path: |
            electron/dist/*.exe
          retention-days: 30
      
      - name: Upload Portable Version
        uses: actions/upload-artifact@v4
        with:
          name: TianjunAI-Windows-Portable
          path: |
            electron/dist/win-unpacked
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
