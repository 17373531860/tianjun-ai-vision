name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 300
    
    steps:
      - name: Free disk space
        shell: pwsh
        run: |
          function Show-Disk {
            $d = Get-PSDrive C
            $total = $d.Used + $d.Free
            $pct = if ($total -gt 0) { [math]::Round($d.Used / $total * 100, 1) } else { 0 }
            Write-Host ("Disk C: used={0:N2}GB free={1:N2}GB ({2}% used)" -f ($d.Used/1GB), ($d.Free/1GB), $pct)
            return $pct
          }

          Write-Host "Disk space before cleanup:"
          $pctBefore = Show-Disk

          # 基础清理（每次构建都跑）
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft Visual Studio\2019" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\CodeQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue

          # v3.8.1: 磁盘占用 >70% 时加做深度清理（conda-pack + Inno 大文件容易顶满 runner）
          $pctMid = Show-Disk
          if ($pctMid -gt 70) {
            Write-Host "WARNING: disk usage ${pctMid}% > 70%, running deep cleanup..."
            Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\MySQL" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "C:\Program Files\Git\usr\share\locale" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Docker" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:ProgramData\Docker" -ErrorAction SilentlyContinue
            Get-ChildItem "$env:RUNNER_TEMP" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem "$env:TEMP" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            if (Get-Command conda -ErrorAction SilentlyContinue) {
              try { conda clean --all -y } catch { Write-Host "conda clean skipped: $_" }
            }
          }

          Write-Host "Disk space after cleanup:"
          $pctAfter = Show-Disk
          if ($pctAfter -gt 85) {
            Write-Host "::warning::Disk still ${pctAfter}% used after cleanup — build may fail on conda-pack/Inno"
          }
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: tianjun
          channels: defaults
          channel-priority: flexible
        env:
          CONDA_SOLVER: classic
      
      - name: Configure conda for stability
        shell: bash -l {0}
        run: |
          conda config --set remote_connect_timeout_secs 60
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --show
      
      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Python version:"
          python --version
          
          echo "Installing PyTorch with CUDA 12.8 (Blackwell sm_120 support)..."
          pip install --retries 5 --timeout 60 torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          
          echo "Installing backend dependencies..."
          pip install --retries 5 --timeout 60 -r backend/requirements.txt
          
          echo "Installing ONNX Runtime GPU..."
          pip install --retries 5 --timeout 60 onnxruntime-gpu
          
          echo "Installing TensorRT..."
          pip install --retries 5 --timeout 120 tensorrt --extra-index-url https://pypi.nvidia.com
          
          echo "Installing scipy (ultralytics dependency)..."
          pip install --retries 5 --timeout 60 "scipy>=1.10.0"
          
          echo "Installing mediapipe (with --no-deps to avoid opencv conflicts)..."
          pip install --retries 5 --timeout 60 --no-deps "mediapipe>=0.10.0,<0.10.21"
          pip install --retries 5 --timeout 60 absl-py attrs flatbuffers jax jaxlib matplotlib "protobuf>=4.25.3,<5" sounddevice sentencepiece
          
          echo "Removing conflicting opencv packages..."
          pip uninstall opencv-python opencv-python-headless opencv-contrib-python -y 2>/dev/null || true
          
          echo "Force-reinstalling numpy from pip (conda numpy ABI incompatible with pip opencv)..."
          pip install --retries 5 --timeout 60 --force-reinstall "numpy>=1.24.0,<2.0"
          
          echo "Installing opencv-contrib-python..."
          pip install --retries 5 --timeout 60 --no-deps "opencv-contrib-python>=4.8.0,<4.11"
          
          echo "Installing conda-pack..."
          pip install --retries 5 --timeout 60 conda-pack
          
          echo "Verifying installations..."
          python -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: expected cu128, got {v} (CUDA {c})'"
          python -c "from ultralytics import YOLO; print('ultralytics OK')"
          python -c "import cv2; print(f'OpenCV: {cv2.__version__}')"
          python -c "import numpy as np; v=np.__version__; print(f'NumPy: {v}'); assert int(v.split('.')[0]) < 2, f'FATAL: numpy {v} >= 2.0 is incompatible with OpenCV 4.11'"
          python -c "import cv2, numpy as np; img=np.zeros((100,100,3),dtype=np.uint8); cv2.resize(img,(50,50)); print('OpenCV+NumPy ABI: OK')"
          python -c "import mediapipe; print(f'MediaPipe: {mediapipe.__version__}')"
          python -c "import onnxruntime; print(f'ONNX Runtime: {onnxruntime.__version__}, providers: {onnxruntime.get_available_providers()}')"
          python -c "try:
            import tensorrt; print(f'TensorRT: {tensorrt.__version__}')
          except ImportError:
            print('WARNING: TensorRT not available (non-fatal on CI without GPU)')"
          python -c "import scipy; print(f'SciPy: {scipy.__version__}')"
          echo "Verifying plugin-system crypto deps (v3.15.x 现场缺 cryptography 导致验签假性失败)..."
          python -c "import cryptography; print(f'cryptography: {cryptography.__version__}')"
          python -c "import jsonschema; print(f'jsonschema: {jsonschema.__version__}')"
          echo "Checking opencv packages..."
          pip list | grep -i opencv
          echo "Checking inference engine packages..."
          pip list | grep -iE "onnx|tensorrt|scipy"
      
      - name: Compile Python backend with Nuitka
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Installing Nuitka..."
          pip install --retries 5 --timeout 60 nuitka ordered-set
          
          echo "=== Compiling core backend files to .pyd ==="
          
          # Core business logic files
          CORE_FILES=(
            "backend/api/source.py"
            "backend/api/detection.py"
            "backend/api/sessions.py"
            "backend/api/projects.py"
            "backend/api/cameras.py"
            "backend/api/alarm.py"
            "backend/api/reports.py"
            "backend/api/tasks.py"
            "backend/api/websocket.py"
            "backend/api/models.py"
            "backend/services/detector.py"
          )
          
          for pyfile in "${CORE_FILES[@]}"; do
            if [ -f "$pyfile" ]; then
              dir=$(dirname "$pyfile")
              filename=$(basename "$pyfile" .py)
              echo "Compiling $pyfile ..."
              python -m nuitka --module "$pyfile" --output-dir="$dir" --remove-output 2>&1 || echo "WARNING: Failed to compile $pyfile, keeping source"
              
              # If .pyd was generated, remove the .py source
              if ls "$dir"/${filename}*.pyd 1>/dev/null 2>&1; then
                echo "  -> Compiled successfully, removing source: $pyfile"
                rm -f "$pyfile"
              else
                echo "  -> Compilation failed, keeping source: $pyfile"
              fi
            fi
          done
          
          echo "=== Compilation complete ==="
          echo "Remaining .py files in backend/api/:"
          ls -la backend/api/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/api/:"
          ls -la backend/api/*.pyd 2>/dev/null || echo "  (none)"
          echo "Remaining .py files in backend/services/:"
          ls -la backend/services/*.py 2>/dev/null || echo "  (none)"
          echo "Generated .pyd files in backend/services/:"
          ls -la backend/services/*.pyd 2>/dev/null || echo "  (none)"
      
      - name: Pack Python environment
        shell: bash -l {0}
        run: |
          conda activate tianjun
          
          echo "Packing conda environment..."
          conda clean -a -y 2>/dev/null || true
          mkdir -p python-env/python
          conda-pack -n tianjun -o python-env/tianjun-env.tar.gz --force --ignore-missing-files
          
          echo "Extracting environment..."
          cd python-env
          tar -xzf tianjun-env.tar.gz -C python
          rm tianjun-env.tar.gz
          
          echo "Environment size:"
          du -sh python
          
          echo "Verifying packed environment PyTorch cu128..."
          python/python.exe -c "import torch; v=torch.__version__; c=torch.version.cuda; print(f'Packed PyTorch: {v}, CUDA: {c}'); assert 'cu128' in v or c.startswith('12.8'), f'FATAL: packed env expected cu128, got {v}'"
      
      - name: Download FFmpeg
        shell: pwsh
        run: |
          echo "Downloading FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Path "ffmpeg" -Force
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -Destination "ffmpeg/"
          Copy-Item "ffmpeg-temp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" -Destination "ffmpeg/"
          Remove-Item -Path "ffmpeg-temp" -Recurse -Force
          Remove-Item -Path "ffmpeg.zip" -Force
          echo "FFmpeg downloaded:"
          Get-ChildItem ffmpeg
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend build completed"
          dir dist
      
      - name: Verify resources before build
        shell: pwsh
        run: |
          echo "=== Checking required resources ==="
          echo "Frontend dist:"
          Test-Path "frontend/dist" 
          Get-ChildItem "frontend/dist" -ErrorAction SilentlyContinue | Select-Object Name
          echo "Backend:"
          Test-Path "backend"
          echo "Python env:"
          Test-Path "python-env/python"
          echo "FFmpeg:"
          Test-Path "ffmpeg"
          Get-ChildItem "ffmpeg" -ErrorAction SilentlyContinue | Select-Object Name
      
      - name: Build Electron App (dir)
        shell: pwsh
        run: |
          cd electron
          npm ci
          echo "Building unpacked app directory..."
          npx electron-builder --dir --x64 2>&1
          echo "=== Unpacked directory ==="
          Test-Path "dist\win-unpacked" 
          Get-ChildItem "dist\win-unpacked" -ErrorAction SilentlyContinue | Select-Object Name
          $size = (Get-ChildItem "dist\win-unpacked" -Recurse | Measure-Object -Property Length -Sum).Sum
          echo "Total unpacked size: $([math]::Round($size/1GB, 2)) GB"

      # v3.15.1: 打包资源自检 — 防止"新增资源忘记加进 files/extraResources"复发.
      # 历史教训: v3.15.0 漏打包 plugin.schema.json(插件装不上) + splash.html(启动无动画).
      # 缺任一关键资源直接红灯阻断发版, 不让残缺安装包流到客户.
      - name: Verify packaged resources (防资源漏打包自检)
        shell: pwsh
        working-directory: electron
        run: |
          $base = "dist\win-unpacked\resources"
          $fail = $false

          # 1) extraResources 产物 (文件系统直接可查) — 插件校验运行时刚需
          $extraMust = @(
            "$base\docs\plugin-system\plugin.schema.json",
            "$base\docs\plugin-system\customer-codes.md",
            "$base\backend\main.py"
          )
          foreach ($f in $extraMust) {
            if (Test-Path $f) { Write-Host "OK  extraResource: $f" }
            else { Write-Host "::error::缺失打包资源(extraResources): $f"; $fail = $true }
          }

          # 2) app.asar 内 files 资源 (需 asar list) — 启动 splash 动画
          $asarPath = "$base\app.asar"
          if (-not (Test-Path $asarPath)) { Write-Host "::error::app.asar 不存在: $asarPath"; exit 1 }
          # asar list 在 Windows 输出反斜杠路径(\splash\index.html), 归一成正斜杠再匹配,
          # 否则带分隔符的目标(如 splash/index.html)会被误判缺失.
          $asarList = (npx --yes asar list "$asarPath") -replace '\\','/'
          $asarMust = @("splash.html", "splash/index.html", "main.js")
          foreach ($f in $asarMust) {
            if ($asarList | Select-String -SimpleMatch $f) { Write-Host "OK  asar: $f" }
            else { Write-Host "::error::app.asar 缺失关键资源: $f"; $fail = $true }
          }

          if ($fail) { Write-Host "打包资源自检未通过 — 阻断发版 (检查 electron/package.json 的 files/extraResources)"; exit 1 }
          Write-Host "打包资源自检通过"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          echo "Installing Inno Setup 6..."
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { echo "ERROR: ISCC.exe not found"; exit 1 }
          echo "Inno Setup installed: $iscc"
          
          echo "Available languages:"
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\Languages" -Filter "*.isl" | Select-Object Name

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          # 版本号单一数据源: electron/package.json
          # push tag 只做触发, 不作为版本来源 (历史 bug: ref_name=main 时 fallback 写死 2.0.8)
          $pkg = Get-Content "electron/package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          if (-not $version) { echo "ERROR: electron/package.json 缺少 version 字段"; exit 1 }
          echo "Building installer for version $version (source: electron/package.json)"
          
          # 如果是 tag 触发, 额外校验 tag 与 package.json 一致, 防止漏改版本号发车
          $refName = "${{ github.ref_name }}"
          if ($refName -like "v*") {
            $tagVersion = $refName.TrimStart("v")
            if ($tagVersion -ne $version) {
              echo "ERROR: tag $refName (=$tagVersion) 与 electron/package.json ($version) 不一致"
              echo "       请先同步 package.json / splash.html 再打 tag"
              exit 1
            }
            echo "Tag $refName matches package.json, OK."
          }
          
          $issFile = "electron\build\installer.iss"
          $content = Get-Content $issFile -Raw
          $content = $content -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText($issFile, $content, [System.Text.Encoding]::UTF8)
          echo "Converted ISS to CRLF + UTF-8"
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion="$version" "electron\build\installer.iss"
          
          echo "=== Installer output ==="
          Get-ChildItem "electron\dist" -Filter "*.exe" | Select-Object Name, Length
          $setup = Get-ChildItem "electron\dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { echo "ERROR: Setup exe not found!"; exit 1 }
          echo "Installer: $($setup.Name) ($([math]::Round($setup.Length/1GB, 2)) GB)"
      
      - name: Upload installer as Action Artifact (不分包, 内部/团队下载用)
        uses: actions/upload-artifact@v4
        continue-on-error: true  # artifact 配额满不阻塞后续 Release 上传
        with:
          name: TianJun-AI-Vision-Installer
          path: electron/dist/TianJun-AI-Vision-*-Setup.exe
          retention-days: 30
          compression-level: 0

      - name: Split installer into parts (仅 tag 触发, 给 Release 用)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem "electron/dist" -Filter "TianJun-AI-Vision-*-Setup.exe" | Select-Object -First 1
          if (-not $setupFile) {
            Write-Error "Setup exe not found!"
            exit 1
          }

          Write-Host "Splitting $($setupFile.Name) ($([math]::Round($setupFile.Length / 1MB, 1)) MB)..."

          $partsDir = "release-parts"
          New-Item -ItemType Directory -Path $partsDir -Force | Out-Null

          $chunkSize = 1900 * 1024 * 1024  # 1.9 GB per chunk → 2 parts for a 3.75GB installer, stays under GitHub Release 2GB single-file limit
          $stream = [System.IO.File]::OpenRead($setupFile.FullName)
          $buffer = New-Object byte[] $chunkSize
          $partNum = 0

          while ($stream.Position -lt $stream.Length) {
              $bytesRead = $stream.Read($buffer, 0, $chunkSize)
              $partName = "{0}.part{1:D2}.part" -f $setupFile.Name, $partNum
              $partPath = Join-Path $partsDir $partName

              $fs = [System.IO.File]::OpenWrite($partPath)
              $fs.Write($buffer, 0, $bytesRead)
              $fs.Close()

              Write-Host "  Created: $partName ($([math]::Round($bytesRead / 1MB, 1)) MB)"
              $partNum++
          }
          $stream.Close()

          Write-Host "Total parts: $partNum"
          echo "TOTAL_PARTS=$partNum" >> $env:GITHUB_ENV

          # Compute SHA256 of original installer and each part
          $sha256 = (Get-FileHash $setupFile.FullName -Algorithm SHA256).Hash
          Write-Host "Installer SHA256: $sha256"
          $expectedSize = $setupFile.Length

          $partHashes = @{}
          $checksumLines = @()
          Get-ChildItem "$partsDir/*.part" | Sort-Object Name | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $partHashes[$_.Name] = $h
              $checksumLines += "$h  $($_.Name)"
              Write-Host "  $($_.Name) SHA256: $h"
          }
          $checksumLines | Out-File -FilePath "$partsDir/checksums.txt" -Encoding UTF8
          Write-Host "Checksums file created"

          # 生成通用合并脚本 merge_installer.bat
          # 历史踩坑 (每条都经过客户现场翻车):
          #   1. 不能嵌 powershell -Command "& {...}" 单行. BOM/引号/encoding 三连爆.
          #   2. 不能用 Out-File -Encoding UTF8 (PS 5.1 默认带 BOM, cmd 读第一行 @echo off 就炸).
          #   3. 不能硬编码版本号/文件名 (ref_name=main 时 fallback 2.0.8 会让 Action 路径也打错名).
          #   4. 不能 setlocal EnableDelayedExpansion + call :Label 联用 (参数展开诡异).
          #   5. echo 文本不能含 ( ) ! | & (if block 内会被 cmd 提前闭合, 报 "此时不应有 xxx").
          # 新版策略: 纯 cmd 内置命令 (copy /b + certutil + findstr), ASCII+CRLF+无 BOM.
          $batLines = @(
            '@echo off',
            'cd /d "%~dp0"',
            'title TianJun AI Vision - Merge Tool',
            '',
            'echo ============================================',
            'echo   TianJun AI Vision - Merge Tool',
            'echo ============================================',
            'echo.',
            'echo Working folder: %cd%',
            '',
            'rem --- 探测输出 exe 文件名 (不硬编码版本号, bat 通用) ---',
            'set "P0="',
            'for /f "delims=" %%f in (''dir /b *.part00.part 2^>nul'') do if not defined P0 set "P0=%%f"',
            'if not defined P0 goto NOFILES',
            'set "OUT=%P0:.part00.part=%"',
            '',
            'set PARTCOUNT=0',
            'for %%f in (*.part) do set /a PARTCOUNT+=1',
            '',
            'echo Output file:     %OUT%',
            'echo Parts found:     %PARTCOUNT%',
            'echo.',
            '',
            'if %PARTCOUNT% LSS 2 goto TOOFEW',
            '',
            'rem --- SHA256 校验 (best-effort, checksums 对不上只警告) ---',
            'set BAD=0',
            'set MISSING=0',
            'if not exist "checksums.txt" goto SKIPVERIFY',
            'echo Verifying SHA256 against checksums.txt ...',
            'echo.',
            'for /f "usebackq tokens=1,2" %%a in ("checksums.txt") do call :VERIFY "%%a" "%%b"',
            'if not "%MISSING%"=="0" (',
            '  echo.',
            '  echo [ERROR] %MISSING% part file missing on disk.',
            '  echo Re-download and put all parts in this folder.',
            '  goto FAILPAUSE',
            ')',
            'if not "%BAD%"=="0" (',
            '  echo.',
            '  echo [WARN] %BAD% part file failed SHA256 check.',
            '  echo Continuing merge anyway. If installer fails to run later,',
            '  echo re-download the [BAD] parts from the release page.',
            ')',
            'echo.',
            'goto DOMERGE',
            '',
            ':SKIPVERIFY',
            'echo [WARN] checksums.txt not found, skipping SHA256 verification.',
            'echo.',
            '',
            ':DOMERGE',
            'echo Merging %PARTCOUNT% parts into "%OUT%" ...',
            'if exist "%OUT%" del /f /q "%OUT%"',
            'set "ARGS="',
            'for /f "delims=" %%p in (''dir /b /o:n *.part'') do call :APPEND "%%p"',
            'if not defined ARGS goto NOFILES',
            'copy /b %ARGS% "%OUT%" >nul',
            'set "COPYERR=%errorlevel%"',
            'if not "%COPYERR%"=="0" goto MERGEFAIL',
            '',
            'echo.',
            'echo ============================================',
            'echo   Merge complete',
            'echo   File: %OUT%',
            'echo ============================================',
            'for %%i in ("%OUT%") do echo   Size: %%~zi bytes',
            'echo.',
            'echo Double-click the output file to install.',
            'echo.',
            'pause',
            'exit /b 0',
            '',
            ':APPEND',
            'if defined ARGS (',
            '  set "ARGS=%ARGS% + %~1"',
            ') else (',
            '  set "ARGS=%~1"',
            ')',
            'goto :eof',
            '',
            ':VERIFY',
            'if not exist %2 (',
            '  echo   [MISSING] %~2',
            '  set /a MISSING+=1',
            '  goto :eof',
            ')',
            'certutil -hashfile %2 SHA256 | findstr /i /c:%1 >nul',
            'if errorlevel 1 (',
            '  echo   [BAD]  %~2',
            '  set /a BAD+=1',
            '  goto :eof',
            ')',
            'echo   [OK]   %~2',
            'goto :eof',
            '',
            ':NOFILES',
            'echo [ERROR] No *.part00.part file in this folder.',
            'echo.',
            'echo Put ALL these files in the SAME folder as this script:',
            'echo   - every *.part file from the release page',
            'echo   - checksums.txt',
            'echo   - merge_installer.bat   ^<-- this script',
            'echo.',
            'echo Download page:',
            'echo   https://github.com/17373531860/tianjun-releases/releases',
            'goto FAILPAUSE',
            '',
            ':TOOFEW',
            'echo [ERROR] Only %PARTCOUNT% .part file found, at least 2 required.',
            'goto FAILPAUSE',
            '',
            ':MERGEFAIL',
            'echo.',
            'echo [ERROR] copy /b failed, exit code %COPYERR%.',
            'echo Possible causes: disk full, access denied, file in use.',
            'goto FAILPAUSE',
            '',
            ':FAILPAUSE',
            'echo.',
            'pause',
            'exit /b 1'
          )
          $batText = ($batLines -join "`r`n") + "`r`n"
          # 必须 ASCII + 无 BOM, 不要用 Out-File -Encoding UTF8
          [System.IO.File]::WriteAllBytes(
            (Join-Path $partsDir "merge_installer.bat"),
            [System.Text.Encoding]::ASCII.GetBytes($batText)
          )
          Write-Host "Merge script created (ASCII/CRLF/no-BOM, universal cross-version): merge_installer.bat"

          # List all files
          Write-Host "`nFiles in $partsDir :"
          Get-ChildItem $partsDir | ForEach-Object { Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Upload parts to GitHub Release (tianjun-releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TARGET_REPO="17373531860/tianjun-releases"
          PARTS_DIR="release-parts"

          echo "=== Uploading v${VERSION} parts to ${TARGET_REPO} ==="
          echo "Files to upload:"
          ls -la "${PARTS_DIR}/"

          # Count expected files (parts + merge_installer.bat + checksums.txt)
          PART_COUNT=$(ls ${PARTS_DIR}/*.part 2>/dev/null | wc -l)
          EXPECTED_COUNT=$((PART_COUNT + 2))  # parts + merge_installer.bat + checksums.txt
          echo "Expected total files: ${EXPECTED_COUNT} (${PART_COUNT} parts + merge_installer.bat + checksums.txt)"

          cat > /tmp/release-notes.md << EOF
          ## ${VERSION} TianJun AI Vision 安装包

          安装包体积 3.75GB，超过 GitHub Release 单文件 2GB 上限，已拆分为 ${PART_COUNT} 个分卷。

          ### 下载步骤（重要：必须下载全部文件）
          请把以下 **${EXPECTED_COUNT} 个文件** 全部下载到 **同一个文件夹**：

          1. \`TianJun-AI-Vision-${VERSION#v}-Setup.exe.part00.part\`  （约 1.9 GB）
          2. \`TianJun-AI-Vision-${VERSION#v}-Setup.exe.part01.part\`  （约 1.9 GB）
          3. \`merge_installer.bat\`  （合并脚本）
          4. \`checksums.txt\`  （校验文件）

          ### 合并步骤
          1. 把上面 4 个文件都下载到 **同一个文件夹**
          2. 双击 \`merge_installer.bat\`
          3. 脚本会自动校验每个分卷的 SHA256，然后合并成 \`TianJun-AI-Vision-${VERSION#v}-Setup.exe\`
          4. 合并成功后双击 .exe 开始安装

          ### 常见问题
          - **提示 "No .part files found"**：所有文件必须放在同一文件夹（通常是下载后移到桌面新建文件夹）
          - **提示 "[BAD]"**：对应分卷下载损坏，重新下载该分卷即可
          - **提示 "SHA256 mismatch"**：下载过程中断或损坏，重新下载所有分卷

          ### 更新内容
          见仓库 \`docs/changelog/${VERSION}_*.md\`
          EOF

          # Delete old release if exists (use --cleanup-tag so stale tag doesn't linger)
          echo "Deleting any existing ${VERSION} release on ${TARGET_REPO} ..."
          gh release delete "${VERSION}" --repo "${TARGET_REPO}" --yes --cleanup-tag 2>/dev/null || true

          # Create release and upload all files in release-parts/ at once (up to 2GB per file is fine)
          echo "Creating release ${VERSION} and uploading ${EXPECTED_COUNT} files..."
          gh release create "${VERSION}" \
            --repo "${TARGET_REPO}" \
            --title "${VERSION} - 天军科技AI视觉检测系统" \
            --notes-file /tmp/release-notes.md \
            "${PARTS_DIR}"/*.part \
            "${PARTS_DIR}/merge_installer.bat" \
            "${PARTS_DIR}/checksums.txt"

          echo ""
          echo "=== Verifying Release contents ==="
          # Retry up to 5 times because GitHub Release assets can lag briefly after upload
          for attempt in 1 2 3 4 5; do
            ACTUAL_COUNT=$(gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            echo "  Attempt ${attempt}: Release has ${ACTUAL_COUNT} / ${EXPECTED_COUNT} assets"
            if [ "$ACTUAL_COUNT" -eq "$EXPECTED_COUNT" ]; then
              break
            fi
            sleep 10
          done

          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: Release asset count mismatch. Expected $EXPECTED_COUNT, got $ACTUAL_COUNT"
            echo "Assets found:"
            gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets[].name'
            exit 1
          fi

          echo ""
          echo "=== All ${ACTUAL_COUNT} files uploaded successfully ==="
          gh release view "${VERSION}" --repo "${TARGET_REPO}" --json assets --jq '.assets[] | "  \(.name)  \((.size/1024/1024*10|floor)/10) MB"'
          echo ""
          echo "Release URL: https://github.com/${TARGET_REPO}/releases/tag/${VERSION}"
