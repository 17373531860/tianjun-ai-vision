name: DB Matrix (SQLite + PostgreSQL)

# 守护 v3.7.0 起的 dialect-aware 数据库层契约
# - 业务代码必须同时跑得通 SQLite (单机部署) 和 PostgreSQL (多客户)
# - Alembic baseline 在 PG 上必须能正常 upgrade
# - SQL 兼容层 (sql_compat.py) 必须覆盖所有 strftime/datetime 调用点

on:
  push:
    branches: [main, "feat/plugin-config"]
    paths:
      - "backend/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/db/**"
      - "tests/**"
      - "docs/database-migration/**"
      - ".github/workflows/db-matrix.yml"
  pull_request:
    paths:
      - "backend/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/db/**"
      - "tests/**"
      - "docs/database-migration/**"
      - ".github/workflows/db-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: ${{ matrix.db }} · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        suite: [unit-bdd]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tianjun
          POSTGRES_PASSWORD: tianjun_test
          POSTGRES_DB: tianjun_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RUNTIME_MODE: test
      TIANJUN_TEST_MODE: 1
      TIANJUN_TEST_PG_SCHEMA: tianjun_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system deps for opencv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-bdd httpx jsonschema cryptography

      # ----------------------------------------------------------
      # PG 专属准备: 等服务就绪 + 创建扩展 + 跑 Alembic baseline
      # ----------------------------------------------------------
      - name: (PG) Wait for postgres + create extensions
        if: matrix.db == 'postgres'
        env:
          PGPASSWORD: tianjun_test
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5433 -U tianjun; then
              echo "postgres ready (attempt $i)"
              break
            fi
            sleep 2
          done
          psql -h 127.0.0.1 -p 5433 -U tianjun -d tianjun_test \
               -f scripts/db/initdb/01-extensions.sql

      - name: (PG) Run Alembic baseline upgrade
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: "postgresql+psycopg2://tianjun:tianjun_test@127.0.0.1:5433/tianjun_test"
        run: |
          alembic upgrade head
          # sanity: 至少要有 plugins / projects / detection_sessions 三张核心表
          PGPASSWORD=tianjun_test psql -h 127.0.0.1 -p 5433 -U tianjun -d tianjun_test \
            -c "\dt public.*" | tee /tmp/pg_tables.txt
          grep -E '\bplugins\b'            /tmp/pg_tables.txt > /dev/null
          grep -E '\bprojects\b'           /tmp/pg_tables.txt > /dev/null
          grep -E '\bdetection_sessions\b' /tmp/pg_tables.txt > /dev/null
          echo "[OK] Alembic baseline on PG schema"

      # ----------------------------------------------------------
      # 跑测试
      # ----------------------------------------------------------
      # 测试面 (2026-08 WS5 扩容): 除 plugin/synthetic/BDD 外, 全量 MES /
      # cluster / scan_pair / 扫码器 / sql_compat / timing 都进双方言矩阵——
      # 捷昌改造 (异步外推/集群上报/scan_pair 新序/PG 迁移) 的回归主战场。
      # 两段拆开跑 (独立 pytest 进程): synthetic/BDD e2e 族对 channel mgr
      # 单例状态敏感, 与几百个单测混在一个进程里会偶发串污染 (单跑必过、
      # 混跑偶挂, 见 test_synthetic_cross_cycle_e2e 文件头注记)。进程隔离
      # 直接消掉跨文件污染面, 失败也更好归因。
      - name: (SQLite) Run unit suites
        if: matrix.db == 'sqlite'
        run: |
          mkdir -p test-results
          python -m pytest \
            tests/plugin_system/ \
            tests/test_mes_*.py \
            tests/test_cluster_*.py \
            tests/test_scan_pair_*.py \
            tests/test_scanner_bypass_monitor.py \
            tests/test_sql_compat_ws5.py \
            tests/test_timing_probe_ws4.py \
            -v --tb=short --maxfail=10 \
            --junitxml=test-results/sqlite-unit.xml

      - name: (SQLite) Run synthetic + BDD
        if: matrix.db == 'sqlite'
        run: |
          python -m pytest \
            tests/test_synthetic_full_flow.py \
            tests/test_synthetic_project_restore.py \
            tests/step_defs/ \
            -v --tb=short --maxfail=10 \
            --junitxml=test-results/sqlite-bdd.xml

      - name: (PG) Run unit suites
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: "postgresql+psycopg2://tianjun:tianjun_test@127.0.0.1:5433/tianjun_test"
        run: |
          mkdir -p test-results
          python -m pytest \
            tests/plugin_system/ \
            tests/test_mes_*.py \
            tests/test_cluster_*.py \
            tests/test_scan_pair_*.py \
            tests/test_scanner_bypass_monitor.py \
            tests/test_sql_compat_ws5.py \
            tests/test_timing_probe_ws4.py \
            -v --tb=short --maxfail=10 \
            --junitxml=test-results/postgres-unit.xml

      - name: (PG) Run synthetic + BDD
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: "postgresql+psycopg2://tianjun:tianjun_test@127.0.0.1:5433/tianjun_test"
        run: |
          python -m pytest \
            tests/test_synthetic_full_flow.py \
            tests/test_synthetic_project_restore.py \
            tests/step_defs/ \
            -v --tb=short --maxfail=10 \
            --junitxml=test-results/postgres-bdd.xml

      # ----------------------------------------------------------
      # PG 专属: sqlite→pg 迁移工具双保险
      #   1. 真数据迁移 pytest (JSON 双编码 / 孤儿 FK / --verify 校验)
      #   2. 空库 dry-run (脚本入口冒烟, 保留)
      # ----------------------------------------------------------
      - name: (PG) Real-data migration test (sqlite→pg + verify)
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: "postgresql+psycopg2://tianjun:tianjun_test@127.0.0.1:5433/tianjun_test"
        run: |
          python -m pytest tests/test_sqlite_to_pg_migration.py \
            -v --tb=short \
            --junitxml=test-results/postgres-migration.xml

      - name: (PG) Smoke-test sqlite→pg data migrator (dry-run)
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: "postgresql+psycopg2://tianjun:tianjun_test@127.0.0.1:5433/tianjun_test"
        run: |
          # 用一个空 SQLite 做 dry-run, 验证脚本入口与表枚举不报错
          python -c "import sqlite3; sqlite3.connect('/tmp/empty.db').close()"
          python scripts/db/sqlite_to_pg.py \
            --sqlite /tmp/empty.db \
            --dry-run

      # ----------------------------------------------------------
      # 上传 junit
      # ----------------------------------------------------------
      - name: Upload junit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: db-matrix-${{ matrix.db }}-junit
          path: test-results/
          retention-days: 7
