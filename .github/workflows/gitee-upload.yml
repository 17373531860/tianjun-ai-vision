name: Upload to Gitee

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.2)'
        required: true
        type: string

env:
  GITEE_OWNER: xu-yanzhi32
  GITEE_REPO1: tianjun-releases
  GITEE_REPO2: tianjun-releases-2
  GH_RELEASE_REPO: 17373531860/tianjun-releases

jobs:
  upload-to-gitee:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download installer from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          echo "Downloading installer for ${VERSION}..."

          gh release download "${VERSION}" \
            --repo "${GH_RELEASE_REPO}" \
            --pattern "*.exe" \
            --dir .

          EXE_NAME=$(ls *.exe | head -1)
          echo "Downloaded: $EXE_NAME ($(du -h "$EXE_NAME" | cut -f1))"
          echo "EXE_NAME=${EXE_NAME}" >> $GITHUB_ENV

      - name: Split installer into chunks
        run: |
          EXE="${EXE_NAME}"
          FILE_SIZE=$(stat -c%s "$EXE")
          echo "Installer: $EXE ($FILE_SIZE bytes, $(( FILE_SIZE / 1048576 )) MB)"

          SHA256=$(sha256sum "$EXE" | awk '{print $1}')
          echo "SHA256: $SHA256"

          CHUNK_SIZE=$((105 * 1024 * 1024))  # ~100MB per chunk → ~20 parts for a 2GB installer
          mkdir -p parts

          split -b ${CHUNK_SIZE} -d -a 2 --additional-suffix=.part "$EXE" "parts/${EXE}.part"

          TOTAL=$(ls parts/*.part | wc -l)
          echo "Split into $TOTAL parts:"
          ls -lh parts/
          echo "TOTAL_PARTS=${TOTAL}" >> $GITHUB_ENV

          # Generate per-part checksums
          echo "Computing per-part SHA256 checksums..."
          for f in parts/*.part; do
            sha256sum "$f" | sed 's|parts/||' >> parts/checksums.txt
          done
          cat parts/checksums.txt

          VERSION="${{ inputs.version }}"
          export VERSION EXE_NAME TOTAL_PARTS SHA256 FILE_SIZE
          export TOTAL_PARTS="$TOTAL"

          # Generate merge script using Python (avoids YAML/bash/batch escaping issues)
          python3 << 'EOFPY'
          import os, textwrap
          v = os.environ.get("VERSION", "")
          exe = os.environ.get("EXE_NAME", "")
          total = os.environ.get("TOTAL_PARTS", "")
          sha = os.environ.get("SHA256", "")
          size = os.environ.get("FILE_SIZE", "")

          content = textwrap.dedent(f"""\
          @echo off
          chcp 65001 >nul
          echo ============================================
          echo   天军科技AI视觉检测系统 - 安装包合并工具
          echo   版本: {v}
          echo ============================================
          echo.
          powershell -ExecutionPolicy Bypass -Command "& {{
            $ErrorActionPreference='Stop'
            $output='{exe}'
            $expectedParts={total}
            $expectedHash='{sha}'
            $expectedSize={size}

            $parts = Get-ChildItem -Filter '*.part' | Sort-Object Name
            if ($parts.Count -eq 0) {{
              Write-Host '[错误] 没有找到 .part 文件！' -ForegroundColor Red
              Write-Host '  第一部分: https://gitee.com/xu-yanzhi32/tianjun-releases/releases'
              Write-Host '  第二部分: https://gitee.com/xu-yanzhi32/tianjun-releases-2/releases'
              exit 1
            }}
            if ($parts.Count -ne $expectedParts) {{
              Write-Host ('[错误] 分块数量不对！找到 ' + $parts.Count + '，期望 ' + $expectedParts) -ForegroundColor Red
              exit 1
            }}
            Write-Host ('找到 ' + $parts.Count + ' 个分块文件，正在逐个校验...') -ForegroundColor Cyan
            Write-Host ''

            $bad = 0
            $checksums = @{{}}
            if (Test-Path 'checksums.txt') {{
              Get-Content 'checksums.txt' | ForEach-Object {{
                $line = $_.Trim()
                if ($line -and $line.Length -gt 64) {{
                  $h = $line.Substring(0,64)
                  $f = $line.Substring(66).Trim()
                  $checksums[$f] = $h
                }}
              }}
            }}

            foreach ($p in $parts) {{
              $hash = (Get-FileHash $p.FullName -Algorithm SHA256).Hash
              if ($checksums.ContainsKey($p.Name)) {{
                if ($hash -eq $checksums[$p.Name]) {{
                  Write-Host ('  [OK] ' + $p.Name) -ForegroundColor Green
                }} else {{
                  Write-Host ('  [损坏] ' + $p.Name) -ForegroundColor Red
                  Write-Host ('         期望: ' + $checksums[$p.Name])
                  Write-Host ('         实际: ' + $hash)
                  $bad++
                }}
              }} else {{
                Write-Host ('  [?] ' + $p.Name + ' (无校验记录)') -ForegroundColor Yellow
              }}
            }}
            Write-Host ''

            if ($bad -gt 0) {{
              Write-Host ('[错误] 发现 ' + $bad + ' 个损坏文件！请重新下载。') -ForegroundColor Red
              exit 1
            }}

            Write-Host '所有分块验证通过，正在合并...' -ForegroundColor Cyan
            if (Test-Path $output) {{ Remove-Item $output -Force }}
            $outStream = [System.IO.File]::Create($output)
            $i = 0
            foreach ($p in $parts) {{
              $i++
              $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
              $outStream.Write($bytes, 0, $bytes.Length)
              Write-Host ('  [' + $i + '/' + $parts.Count + '] ' + $p.Name + ' OK')
            }}
            $outStream.Close()

            $actualSize = (Get-Item $output).Length
            if ($actualSize -ne $expectedSize) {{
              Write-Host ('[错误] 文件大小不匹配！') -ForegroundColor Red
              Remove-Item $output -Force
              exit 1
            }}

            Write-Host ''
            Write-Host '正在做最终 SHA256 校验...' -ForegroundColor Cyan
            $finalHash = (Get-FileHash $output -Algorithm SHA256).Hash
            if ($finalHash -eq $expectedHash) {{
              Write-Host ''
              Write-Host '============================================' -ForegroundColor Green
              Write-Host ('  [成功] 合并并验证通过！') -ForegroundColor Green
              Write-Host ('  安装程序: ' + $output) -ForegroundColor Green
              Write-Host ('  SHA256: ' + $finalHash) -ForegroundColor Green
              Write-Host '============================================' -ForegroundColor Green
              Write-Host ''
              Write-Host '请双击运行安装程序进行安装。'
            }} else {{
              Write-Host '[错误] SHA256 校验失败！' -ForegroundColor Red
              Write-Host ('  实际: ' + $finalHash)
              Write-Host ('  期望: ' + $expectedHash)
              Remove-Item $output -Force
            }}
          }}"
          echo.
          pause
          """)

          with open("parts/merge_installer.bat", "w", encoding="utf-8") as f:
              f.write(content)
          print("Merge script created")
          EOFPY

          echo "Merge script created with SHA256 verification"

      - name: Clean ALL old releases from Gitee repos
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          delete_all_releases() {
            local REPO="$1"
            echo "=== Cleaning all releases from $REPO ==="
            RELEASES=$(curl -s "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null)
            IDS=$(echo "$RELEASES" | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          for r in releases:
              print(r['id'])
          " 2>/dev/null || echo "")

            if [ -z "$IDS" ]; then
              echo "  No releases found or failed to parse."
              return 0
            fi

            for RID in $IDS; do
              echo "  Deleting release ID $RID..."
              curl -s -X DELETE "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}?access_token=${GITEE_TOKEN}"
              sleep 1
            done
            echo "  Done cleaning $REPO"
          }

          delete_all_releases "${GITEE_REPO1}"
          delete_all_releases "${GITEE_REPO2}"
          echo ""
          echo "All old releases deleted. Waiting 10s for quota to settle..."
          sleep 10

      - name: Upload to Gitee repo 1
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TOTAL="${TOTAL_PARTS}"
          HALF=$(( (TOTAL + 1) / 2 ))

          echo "Total: $TOTAL parts. Repo 1 gets first $HALF parts + merge script."

          upload_file() {
            local FILE="$1" REPO="$2" RID="$3"
            local FNAME=$(basename "$FILE")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 1200 \
                -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE}")
              if [ "$HTTP_CODE" = "201" ]; then
                echo "  OK: $FNAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              cat /tmp/gitee_resp.json 2>/dev/null | head -c 300
              echo ""
              sleep 10
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${VERSION} on ${GITEE_REPO1}..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${VERSION}',
            'name': '${VERSION} TianJun AI Vision (Part 1)',
            'body': '## ${VERSION} TianJun AI Vision (Part 1)\n\nDownload Part 2: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO2}/releases/tag/${VERSION}-part2\n\n### How to use\n1. Download all .part files and merge_installer.bat from this page\n2. Download all .part files from Part 2 page\n3. Put all files in the same folder\n4. Run merge_installer.bat\n5. Run the merged installer',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_body.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO1}/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_body.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created: ID=$RELEASE_ID"

          # Upload merge script and checksums
          echo "Uploading merge_installer.bat..."
          upload_file "parts/merge_installer.bat" "${GITEE_REPO1}" "$RELEASE_ID" || echo "Warning: merge script failed"
          echo "Uploading checksums.txt..."
          upload_file "parts/checksums.txt" "${GITEE_REPO1}" "$RELEASE_ID" || echo "Warning: checksums failed"

          # Upload first batch of parts
          FILES=($(ls parts/*.part | sort))
          FAILED=0
          for i in $(seq 0 $((HALF - 1))); do
            FILE="${FILES[$i]}"
            if [ -n "$FILE" ]; then
              echo "Uploading $(basename $FILE)..."
              upload_file "$FILE" "${GITEE_REPO1}" "$RELEASE_ID" || FAILED=$((FAILED + 1))
            fi
          done

          echo "Repo 1 upload complete! (failures: $FAILED)"
          if [ $FAILED -gt 0 ]; then echo "WARNING: $FAILED files failed"; fi

      - name: Upload to Gitee repo 2
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TOTAL="${TOTAL_PARTS}"
          HALF=$(( (TOTAL + 1) / 2 ))

          REMAINING=$((TOTAL - HALF))
          if [ "$REMAINING" -le 0 ]; then
            echo "All parts fit in repo 1, skipping."
            exit 0
          fi

          echo "Repo 2 gets remaining $REMAINING parts."
          TAG="${VERSION}-part2"

          upload_file() {
            local FILE="$1" REPO="$2" RID="$3"
            local FNAME=$(basename "$FILE")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 1200 \
                -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE}")
              if [ "$HTTP_CODE" = "201" ]; then
                echo "  OK: $FNAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              cat /tmp/gitee_resp.json 2>/dev/null | head -c 300
              echo ""
              sleep 10
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${TAG} on ${GITEE_REPO2}..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${TAG}',
            'name': '${VERSION} TianJun AI Vision (Part 2)',
            'body': '## ${VERSION} TianJun AI Vision (Part 2)\n\nDownload Part 1: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO1}/releases/tag/${VERSION}\n\nPut all .part files together with Part 1 files, then run merge_installer.bat from Part 1.',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_body2.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO2}/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_body2.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release on repo 2!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created: ID=$RELEASE_ID"

          FILES=($(ls parts/*.part | sort))
          FAILED=0
          for i in $(seq $HALF $((TOTAL - 1))); do
            FILE="${FILES[$i]}"
            if [ -n "$FILE" ]; then
              echo "Uploading $(basename $FILE)..."
              upload_file "$FILE" "${GITEE_REPO2}" "$RELEASE_ID" || FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Gitee Release Complete ==="
          echo "Part 1: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO1}/releases/tag/${VERSION}"
          echo "Part 2: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO2}/releases/tag/${TAG}"
          echo "Repo 2 failures: $FAILED"
