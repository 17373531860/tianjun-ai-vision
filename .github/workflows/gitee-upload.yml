name: Upload to Gitee

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.2)'
        required: true
        type: string

env:
  GITEE_OWNER: xu-yanzhi32
  GITEE_REPO1: tianjun-releases
  GITEE_REPO2: tianjun-releases-2
  GH_RELEASE_REPO: 17373531860/tianjun-releases

jobs:
  upload-to-gitee:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download installer from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          echo "Downloading installer for ${VERSION}..."

          gh release download "${VERSION}" \
            --repo "${GH_RELEASE_REPO}" \
            --pattern "*.exe" \
            --dir .

          EXE_NAME=$(ls *.exe | head -1)
          echo "Downloaded: $EXE_NAME ($(du -h "$EXE_NAME" | cut -f1))"
          echo "EXE_NAME=${EXE_NAME}" >> $GITHUB_ENV

      - name: Split installer into chunks
        run: |
          EXE="${EXE_NAME}"
          FILE_SIZE=$(stat -c%s "$EXE")
          echo "Installer: $EXE ($FILE_SIZE bytes, $(( FILE_SIZE / 1048576 )) MB)"

          CHUNK_SIZE=$((50 * 1024 * 1024))  # 50MB per chunk
          mkdir -p parts

          split -b ${CHUNK_SIZE} -d -a 2 --additional-suffix=.part "$EXE" "parts/${EXE}.part"

          TOTAL=$(ls parts/*.part | wc -l)
          echo "Split into $TOTAL parts:"
          ls -lh parts/
          echo "TOTAL_PARTS=${TOTAL}" >> $GITHUB_ENV

          VERSION="${{ inputs.version }}"
          cat > "parts/merge_installer.bat" << 'EOFBAT'
          @echo off
          chcp 65001 >nul
          setlocal enabledelayedexpansion
          echo ============================================
          echo   TianJun AI Vision - Installer Merge Tool
          echo ============================================
          echo.
          echo Merging installer parts, please wait...
          echo.

          set "count=0"
          set "cmd=copy /b"
          set "first=1"

          for /f "delims=" %%f in ('dir /b /o:n *.part 2^>nul') do (
              set /a count+=1
              if !first!==1 (
                  set "cmd=!cmd! "%%f""
                  set "first=0"
              ) else (
                  set "cmd=!cmd!+"%%f""
              )
          )

          if !count!==0 (
              echo [Error] No .part files found!
              echo Please download all .part files from both repos.
              pause
              exit /b 1
          )

          for /f "delims=" %%f in ('dir /b /o:n *.part 2^>nul') do (
              set "output=%%~nf"
              set "output=!output:~0,-7!"
              goto :found
          )
          :found

          set "cmd=!cmd! "!output!""
          echo Found !count! parts, merging...
          !cmd! >nul

          if exist "!output!" (
              echo.
              echo ============================================
              echo   Merge complete!
              echo   Installer: !output!
              echo ============================================
              echo.
              echo Please run the installer to install.
          ) else (
              echo.
              echo [Error] Merge failed. Check file integrity.
          )

          pause
          EOFBAT

          echo "Merge script created"

      - name: Clean ALL old releases from Gitee repos
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          delete_all_releases() {
            local REPO="$1"
            echo "=== Cleaning all releases from $REPO ==="
            RELEASES=$(curl -s "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100" 2>/dev/null)
            IDS=$(echo "$RELEASES" | python3 -c "
          import sys, json
          releases = json.load(sys.stdin)
          for r in releases:
              print(r['id'])
          " 2>/dev/null || echo "")

            if [ -z "$IDS" ]; then
              echo "  No releases found or failed to parse."
              return 0
            fi

            for RID in $IDS; do
              echo "  Deleting release ID $RID..."
              curl -s -X DELETE "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}?access_token=${GITEE_TOKEN}"
              sleep 1
            done
            echo "  Done cleaning $REPO"
          }

          delete_all_releases "${GITEE_REPO1}"
          delete_all_releases "${GITEE_REPO2}"
          echo ""
          echo "All old releases deleted. Waiting 10s for quota to settle..."
          sleep 10

      - name: Upload to Gitee repo 1
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TOTAL="${TOTAL_PARTS}"
          HALF=$(( (TOTAL + 1) / 2 ))

          echo "Total: $TOTAL parts. Repo 1 gets first $HALF parts + merge script."

          upload_file() {
            local FILE="$1" REPO="$2" RID="$3"
            local FNAME=$(basename "$FILE")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 600 \
                -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE}")
              if [ "$HTTP_CODE" = "201" ]; then
                echo "  OK: $FNAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              cat /tmp/gitee_resp.json 2>/dev/null | head -c 300
              echo ""
              sleep 10
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${VERSION} on ${GITEE_REPO1}..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${VERSION}',
            'name': '${VERSION} TianJun AI Vision (Part 1)',
            'body': '## ${VERSION} TianJun AI Vision (Part 1)\n\nDownload Part 2: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO2}/releases/tag/${VERSION}-part2\n\n### How to use\n1. Download all .part files and merge_installer.bat from this page\n2. Download all .part files from Part 2 page\n3. Put all files in the same folder\n4. Run merge_installer.bat\n5. Run the merged installer',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_body.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO1}/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_body.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created: ID=$RELEASE_ID"

          # Upload merge script
          echo "Uploading merge_installer.bat..."
          upload_file "parts/merge_installer.bat" "${GITEE_REPO1}" "$RELEASE_ID" || echo "Warning: merge script failed"

          # Upload first batch of parts
          FILES=($(ls parts/*.part | sort))
          FAILED=0
          for i in $(seq 0 $((HALF - 1))); do
            FILE="${FILES[$i]}"
            if [ -n "$FILE" ]; then
              echo "Uploading $(basename $FILE)..."
              upload_file "$FILE" "${GITEE_REPO1}" "$RELEASE_ID" || FAILED=$((FAILED + 1))
            fi
          done

          echo "Repo 1 upload complete! (failures: $FAILED)"
          if [ $FAILED -gt 0 ]; then echo "WARNING: $FAILED files failed"; fi

      - name: Upload to Gitee repo 2
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TOTAL="${TOTAL_PARTS}"
          HALF=$(( (TOTAL + 1) / 2 ))

          REMAINING=$((TOTAL - HALF))
          if [ "$REMAINING" -le 0 ]; then
            echo "All parts fit in repo 1, skipping."
            exit 0
          fi

          echo "Repo 2 gets remaining $REMAINING parts."
          TAG="${VERSION}-part2"

          upload_file() {
            local FILE="$1" REPO="$2" RID="$3"
            local FNAME=$(basename "$FILE")
            local MAX_RETRIES=3
            for attempt in $(seq 1 $MAX_RETRIES); do
              echo "  Attempt $attempt/$MAX_RETRIES for $FNAME ..."
              HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" --max-time 600 \
                -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${REPO}/releases/${RID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${FILE}")
              if [ "$HTTP_CODE" = "201" ]; then
                echo "  OK: $FNAME (HTTP 201)"
                return 0
              fi
              echo "  FAILED: HTTP $HTTP_CODE"
              cat /tmp/gitee_resp.json 2>/dev/null | head -c 300
              echo ""
              sleep 10
            done
            echo "  GIVE UP after $MAX_RETRIES attempts for $FNAME"
            return 1
          }

          # Create release
          echo "Creating release ${TAG} on ${GITEE_REPO2}..."
          python3 -c "
          import json, sys
          body = {
            'access_token': '${GITEE_TOKEN}',
            'tag_name': '${TAG}',
            'name': '${VERSION} TianJun AI Vision (Part 2)',
            'body': '## ${VERSION} TianJun AI Vision (Part 2)\n\nDownload Part 1: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO1}/releases/tag/${VERSION}\n\nPut all .part files together with Part 1 files, then run merge_installer.bat from Part 1.',
            'target_commitish': 'master'
          }
          sys.stdout.write(json.dumps(body, ensure_ascii=False))
          " > /tmp/gitee_body2.json

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO2}/releases" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/gitee_body2.json)

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "" ]; then
            echo "ERROR: Failed to create release on repo 2!"
            echo "$RESPONSE"
            exit 1
          fi
          echo "Release created: ID=$RELEASE_ID"

          FILES=($(ls parts/*.part | sort))
          FAILED=0
          for i in $(seq $HALF $((TOTAL - 1))); do
            FILE="${FILES[$i]}"
            if [ -n "$FILE" ]; then
              echo "Uploading $(basename $FILE)..."
              upload_file "$FILE" "${GITEE_REPO2}" "$RELEASE_ID" || FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Gitee Release Complete ==="
          echo "Part 1: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO1}/releases/tag/${VERSION}"
          echo "Part 2: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO2}/releases/tag/${TAG}"
          echo "Repo 2 failures: $FAILED"
