name: Virtual Functional Tests (Windows)

# Windows 跑道：客户全部跑 Windows 工控机，e2e 必须在 windows-latest 也过一遍
# 与 test-virtual.yml 的 ubuntu e2e job 同构：真后端 + 真前端 build + Playwright
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/test-virtual-windows.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-browser-windows:
    name: Playwright E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RUNTIME_MODE: test
      TIANJUN_TEST_MODE: 1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-bdd pytest-playwright requests httpx

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Windows runner 会在 step 结束时回收其派生进程（实测连 Start-Process 脱壳
      # 也活不过 step 边界：日志停在启动中段、端口 12min 全程 000）。
      # 唯一稳妥做法：起服务 + 等端口 + 跑 pytest 全部收进同一个 bash step，
      # 后台进程在 step 存续期内天然存活，测完再统一收尸。
      - name: Start servers, wait ports, run Playwright E2E
        run: |
          mkdir -p ci-logs test-results
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 \
            > ci-logs/backend.log 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npx vite preview --host 127.0.0.1 --port 6001 \
            > ../ci-logs/frontend.log 2>&1) &
          FRONTEND_PID=$!

          # torch/cv2 冷 import 在 Windows runner 明显慢于 ubuntu，窗口 ~12min，
          # 每 10 轮打一次两端口 http code 方便失败归因
          ready=0
          for i in $(seq 1 240); do
            be=$(curl -s -o /dev/null --max-time 3 -w '%{http_code}' http://127.0.0.1:8001/api/v1/test/synthetic/state) || be=000
            fe=$(curl -s -o /dev/null --max-time 3 -w '%{http_code}' http://127.0.0.1:6001/) || fe=000
            if [ "$be" = "200" ] && [ "$fe" = "200" ]; then
              echo "ports ready (attempt $i)"
              ready=1
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "attempt $i: backend=$be frontend=$fe"
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "ports NOT ready (backend=$be frontend=$fe)"
            tail -150 ci-logs/backend.log || true
            tail -80 ci-logs/frontend.log || true
            kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true
            exit 1
          fi

          set +e
          python -m pytest tests/e2e_browser/ \
            -v --tb=short \
            --junitxml=test-results/e2e-windows.xml
          rc=$?
          set -e
          kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true
          exit $rc

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-windows
          path: |
            C:\tmp\sat_full_workflow_shots\
            C:\tmp\uat_shots\
            test-results/
          retention-days: 7

      - name: Upload backend/frontend logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-logs-windows
          path: ci-logs/
          retention-days: 7
