<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动中...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: #e0e0e0;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 200, 255, 0.3);
    }
    
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #00c8ff;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
    }
    
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 30px;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    
    .loading-progress {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #00c8ff, #0080ff);
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }
    
    @keyframes loading {
      0% {
        width: 0%;
        margin-left: 0%;
      }
      50% {
        width: 60%;
        margin-left: 20%;
      }
      100% {
        width: 0%;
        margin-left: 100%;
      }
    }
    
    .loading-text {
      font-size: 13px;
      color: #aaa;
    }
    
    .version {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <img class="logo" src="build/icon.png" alt="Logo" onerror="this.style.display='none'">
  <div class="title">天军科技AI视觉检测系统</div>
  <div class="subtitle">Tianjun AI Vision Detection System</div>
  <div class="loading-container">
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
    <div class="loading-text">正在启动服务...</div>
  </div>
  <div class="version">v3.1.1</div>
</body>
</html>
