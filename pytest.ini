[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
bdd_features_base_dir = tests/features
addopts = -v --tb=short --strict-markers -p no:cacheprovider
markers =
    bdd: BDD scenarios
    slow: marks tests as slow
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
